<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#fff7ed" />
  <meta name="apple-mobile-web-app-title" content="여행 지도" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>우리가족 국내여행지도</title>
  <meta name="description" content="우리 가족이 다녀온 지역을 색칠하고 장소에 스티커를 붙이는 국내 여행 지도" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="우리가족 국내여행지도" />
  <meta property="og:description" content="다녀온 곳을 같이 색칠하고 스티커를 붙여요 🗺️" />
  <meta property="og:image" content="https://harry-gimsong.github.io/PR/travel-map/icon-512.png" />
  <style>
    :root {
      color-scheme: light;
      --bg: #fff7ed;
      --card: #ffffff;
      --text: #3f2d20;
      --sub: #8a7565;
      --line: #f0e3d4;
      --land: #f3ece3;
      --sea: #eaf5fb;
      --primary: #f97316;
      --primary-dark: #ea580c;
      --danger: #ef4444;
      --shadow: 0 8px 24px rgba(120, 72, 30, 0.10);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    button { font: inherit; color: inherit; cursor: pointer; }

    /* 상단 */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px 20px;
      padding-top: max(14px, env(safe-area-inset-top));
    }

    .top h1 {
      margin: 0;
      font-size: 1.45rem;
      outline: none;
      border-bottom: 2px dashed transparent;
    }

    .top h1:focus { border-bottom-color: var(--primary); }

    .summary { color: var(--sub); font-size: 0.95rem; }
    .summary b { color: var(--primary-dark); }

    /* 레이아웃 */
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 16px;
      padding: 0 16px max(16px, env(safe-area-inset-bottom));
      height: calc(100vh - 64px);
      height: calc(100dvh - 64px);
    }

    .map-wrap {
      position: relative;
      background: var(--sea);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 420px;
    }

    #map {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      user-select: none;
    }

    .region { cursor: pointer; transition: fill 0.25s; }
    .region:hover { filter: brightness(0.94); }
    .sticker { cursor: grab; }
    .labels text {
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.9);
      stroke-width: 3px;
      stroke-linejoin: round;
      fill: #5b4636;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      font-weight: 600;
    }
    .labels .prov-label { font-size: 14px; font-weight: 800; fill: #8a5a33; }
    .labels .muni-label { font-size: 11.5px; }
    .sticker.dragging { cursor: grabbing; }

    /* 도구 */
    .toolbar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      z-index: 2;
    }

    .toolbar > * { pointer-events: auto; }

    .modes {
      display: inline-flex;
      align-self: flex-start;
      background: var(--card);
      border-radius: 999px;
      padding: 4px;
      box-shadow: var(--shadow);
    }

    .modes button {
      border: 0;
      background: transparent;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 600;
    }

    .modes button.on { background: var(--primary); color: #fff; }

    .tray {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-self: flex-start;
      max-width: 300px;
      background: var(--card);
      border-radius: 16px;
      padding: 6px;
      box-shadow: var(--shadow);
      scrollbar-width: none;
    }

    .tray.hidden { display: none; }

    .swatch, .emoji-btn {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid transparent;
      display: grid;
      place-items: center;
      background: transparent;
      padding: 0;
    }

    .swatch.on, .emoji-btn.on { border-color: var(--text); }

    .group-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px 0 8px;
      border-radius: 999px;
      border: 2px solid transparent;
      background: #faf5ef;
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .group-btn i { width: 18px; height: 18px; border-radius: 50%; flex: 0 0 auto; }
    .group-btn.on { border-color: var(--text); background: #fff; }
    .group-btn.edit { padding: 0 12px; color: var(--sub); }

    .group-stats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.85rem; margin-bottom: 12px; }
    .group-stats span { display: inline-flex; align-items: center; gap: 5px; }
    .group-stats i { width: 12px; height: 12px; border-radius: 50%; }

    .group-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .group-row .swatch { width: 34px; height: 34px; }
    .group-row input {
      flex: 1;
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font: inherit;
    }
    .group-row .del { border: 0; background: transparent; font-size: 1.1rem; color: var(--sub); padding: 4px 6px; }
    .emoji-btn { font-size: 20px; border-radius: 12px; }
    .emoji-btn.on { background: #fff1e0; }
    .swatch.eraser { background: #fff; border: 2px dashed #c9b6a5; font-size: 16px; }
    .swatch.eraser.on { border: 3px solid var(--text); }

    .hint {
      position: absolute;
      left: 12px;
      bottom: 12px;
      max-width: calc(100% - 80px);
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      color: var(--sub);
      z-index: 2;
    }

    .zoom-ctl {
      position: absolute;
      right: 12px;
      bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 2;
    }

    .zoom-ctl button {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 12px;
      background: var(--card);
      box-shadow: var(--shadow);
      font-size: 1.1rem;
    }

    .tooltip {
      position: absolute;
      pointer-events: none;
      background: var(--text);
      color: #fff;
      font-size: 0.82rem;
      padding: 5px 9px;
      border-radius: 8px;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, -130%);
      z-index: 3;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);
      background: var(--text);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      opacity: 0;
      transition: 0.25s;
      pointer-events: none;
      z-index: 20;
      max-width: calc(100vw - 32px);
      text-align: center;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* 오른쪽 패널 */
    .panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      min-height: 0;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .card h2 { margin: 0 0 10px; font-size: 1rem; }

    .big-num { font-size: 1.8rem; font-weight: 800; }
    .big-num small { font-size: 0.95rem; color: var(--sub); font-weight: 500; }

    .bar {
      height: 12px;
      background: var(--line);
      border-radius: 999px;
      overflow: hidden;
      margin: 8px 0 12px;
    }

    .bar > div {
      height: 100%;
      background: linear-gradient(90deg, #fdba74, var(--primary));
      border-radius: 999px;
      transition: width 0.4s;
    }

    .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

    .chip {
      border: 0;
      border-radius: 10px;
      padding: 6px 4px;
      font-size: 0.8rem;
      background: #faf5ef;
      color: var(--sub);
      text-align: center;
    }

    .chip.on { background: #ffedd5; color: var(--primary-dark); font-weight: 700; }

    .records { list-style: none; margin: 0; padding: 0; }

    .year-group { border-top: 1px solid var(--line); }
    .year-group:first-child { border-top: 0; }

    .year-group summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px;
      font-weight: 700;
      cursor: pointer;
      list-style: none;
    }

    .year-group summary::-webkit-details-marker { display: none; }
    .year-group summary::after { content: "▾"; color: var(--sub); transition: transform 0.2s; }
    .year-group:not([open]) summary::after { transform: rotate(-90deg); }
    .year-group summary small { color: var(--sub); font-weight: 500; margin-left: 6px; }
    .year-group .records { margin-bottom: 6px; }

    .more-btn { width: 100%; margin-top: 8px; }
    .visit-list { max-height: 45vh; overflow-y: auto; }

    .view-tabs { display: flex; background: #faf5ef; border-radius: 999px; padding: 3px; margin-bottom: 6px; }
    .view-tabs button { flex: 1; border: 0; background: transparent; padding: 7px; border-radius: 999px; font-weight: 600; font-size: 0.88rem; color: var(--sub); }
    .view-tabs button.on { background: #fff; color: var(--text); box-shadow: 0 1px 4px rgba(120, 72, 30, 0.12); }

    .records li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 6px;
      border-top: 1px solid var(--line);
      cursor: pointer;
      border-radius: 10px;
    }

    .records li:first-child { border-top: 0; }
    .records li:hover { background: #fffaf4; }

    .rec-icon {
      flex: 0 0 30px;
      height: 30px;
      display: grid;
      place-items: center;
      font-size: 18px;
      border-radius: 50%;
    }

    .rec-body { flex: 1; min-width: 0; }
    .rec-title { font-weight: 600; }
    .rec-sub { font-size: 0.8rem; color: var(--sub); }

    .rec-memo {
      font-size: 0.85rem;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty { color: var(--sub); font-size: 0.9rem; text-align: center; padding: 12px 0; }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 10px;
      background: #faf5ef;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .btn.primary { background: var(--primary); color: #fff; }
    .btn.danger { color: var(--danger); }

    /* 함께 쓰기 */
    .share-status { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; margin-bottom: 10px; }
    .share-status .dot { width: 10px; height: 10px; border-radius: 50%; background: #d6c7b8; flex: 0 0 auto; }
    .share-status .dot.live { background: #22c55e; }
    .share-status .dot.wait { background: #f59e0b; }
    .share-status .dot.error { background: var(--danger); }
    .share-note { font-size: 0.85rem; color: var(--sub); margin: 0 0 10px; line-height: 1.5; }
    .share-code { font-family: ui-monospace, monospace; background: #faf5ef; border-radius: 8px; padding: 2px 6px; }
    .join-row { display: flex; gap: 6px; margin-top: 8px; }
    .join-row input {
      flex: 1;
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font: inherit;
      font-size: 0.9rem;
    }

    /* 대화상자 */
    dialog {
      border: 0;
      border-radius: 22px;
      padding: 20px;
      width: min(420px, calc(100vw - 32px));
      box-shadow: 0 20px 60px rgba(60, 30, 10, 0.25);
      color: var(--text);
    }

    dialog::backdrop { background: rgba(63, 45, 32, 0.35); }
    dialog h3 { margin: 0 0 4px; font-size: 1.2rem; }
    dialog .sub { color: var(--sub); font-size: 0.85rem; margin-bottom: 14px; }

    dialog label {
      display: block;
      font-size: 0.85rem;
      color: var(--sub);
      margin-bottom: 12px;
    }

    dialog input[type="text"], dialog input[type="date"], dialog textarea {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font: inherit;
      color: var(--text);
      background: #fffdfb;
    }

    dialog textarea { resize: vertical; }
    .pick-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
    .dlg-actions { display: flex; gap: 8px; align-items: center; }
    .dlg-actions .spacer { flex: 1; }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; height: auto; }
      .map-wrap { height: 72vh; height: 72dvh; }
      .panel { overflow: visible; }
      .top h1 { font-size: 1.25rem; }
      .tray { flex-wrap: nowrap; max-width: 100%; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <header class="top">
    <h1 id="title" contenteditable="true" spellcheck="false" title="눌러서 제목 바꾸기">우리가족 국내여행지도</h1>
    <div class="summary" id="summary"></div>
  </header>

  <main class="layout">
    <section class="map-wrap">
      <div class="toolbar">
        <div class="modes">
          <button data-mode="paint" class="on">🖍️ 색칠</button>
          <button data-mode="sticker">⭐ 스티커</button>
        </div>
        <div class="tray" id="paintTray"></div>
        <div class="tray hidden" id="stickerTray"></div>
      </div>
      <svg id="map" aria-label="대한민국 지도"></svg>
      <div class="hint" id="hint"></div>
      <div class="zoom-ctl">
        <button id="zoomIn" aria-label="확대">＋</button>
        <button id="zoomOut" aria-label="축소">－</button>
        <button id="zoomReset" aria-label="전체 보기">⟲</button>
      </div>
      <div class="tooltip" id="tip"></div>
    </section>

    <aside class="panel">
      <div class="card">
        <h2>우리가 다녀온 곳</h2>
        <div class="big-num" id="statRegions"></div>
        <div class="bar"><div id="statBar"></div></div>
        <div class="group-stats" id="groupStats"></div>
        <div class="chips" id="provChips"></div>
      </div>

      <div class="card">
        <h2>👨‍👩‍👧 함께 쓰기</h2>
        <div id="shareBody"></div>
      </div>

      <div class="card">
        <h2>여행 기록</h2>
        <div id="records"></div>
      </div>

      <div class="card">
        <div class="actions">
          <button class="btn primary" id="btnPng">📷 이미지 저장</button>
          <button class="btn" id="btnExport">💾 백업 저장</button>
          <button class="btn" id="btnImport">📂 백업 불러오기</button>
          <button class="btn danger" id="btnReset">🗑 처음부터</button>
        </div>
        <input type="file" id="fileInput" accept="application/json,.json" hidden />
      </div>
    </aside>
  </main>

  <dialog id="regionDlg">
    <form method="dialog" id="rdForm">
      <h3 id="rdTitle"></h3>
      <div id="rdList">
        <div class="sub" id="rdCount"></div>
        <ul class="records visit-list" id="rdVisits"></ul>
        <button type="button" class="btn primary" id="rdAdd" style="width: 100%; margin: 6px 0 14px;">＋ 또 다녀왔어요</button>
        <div class="dlg-actions">
          <button type="button" class="btn danger" id="rdClear">모두 지우기</button>
          <span class="spacer"></span>
          <button class="btn" value="close" formnovalidate>닫기</button>
        </div>
      </div>
      <div id="rdEdit" hidden>
        <div class="sub" id="rdEditSub">누구와 다녀왔나요?</div>
        <div class="pick-row" id="rdGroups"></div>
        <label>다녀온 날 <input type="date" name="date" /></label>
        <label>메모 <textarea name="memo" rows="3" placeholder="예) 도하가 처음 바다를 본 곳!"></textarea></label>
        <div class="dlg-actions">
          <button type="button" class="btn danger" id="rdDelete">이 기록 삭제</button>
          <span class="spacer"></span>
          <button type="button" class="btn" id="rdBack">뒤로</button>
          <button type="button" class="btn primary" id="rdSave">저장</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="groupDlg">
    <form method="dialog">
      <h3>누구와 갔나요?</h3>
      <div class="sub">색칠할 때 고를 동행이에요. 색을 눌러 바꾸고, 이름을 고치거나 새로 추가할 수 있어요.</div>
      <div id="gdRows"></div>
      <button type="button" class="btn" id="gdAdd" style="width: 100%; margin: 4px 0 14px;">＋ 동행 추가</button>
      <div class="dlg-actions">
        <span class="spacer"></span>
        <button class="btn" value="cancel" formnovalidate>취소</button>
        <button class="btn primary" value="save">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="stickerDlg">
    <form method="dialog">
      <h3 id="sdTitle"></h3>
      <div class="sub" id="sdSub"></div>
      <div class="pick-row" id="sdEmojis"></div>
      <label>장소 이름 <input type="text" name="name" placeholder="예) 해운대 해수욕장" /></label>
      <label>다녀온 날 <input type="date" name="date" /></label>
      <label>메모 <textarea name="memo" rows="3" placeholder="예) 조개껍데기 줍기 대회 우승 🏆"></textarea></label>
      <div class="dlg-actions">
        <button class="btn danger" value="delete" id="sdDelete">떼어내기</button>
        <span class="spacer"></span>
        <button class="btn" value="cancel" formnovalidate>취소</button>
        <button class="btn primary" value="save">붙이기</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
  <script type="module">
    /* ===== 기본 설정 ===== */
    const STORE_KEY = "dohaTravelMap.v1";
    const DEFAULT_TITLE = "우리가족 국내여행지도";
    const OLD_DEFAULT_TITLES = ["도하랑 여행 지도"];
    const W = 800, H = 820;
    const LAND = "#f3ece3";

    const PROVINCES = {
      "11": "서울", "21": "부산", "22": "대구", "23": "인천", "24": "광주",
      "25": "대전", "26": "울산", "29": "세종", "31": "경기", "32": "강원",
      "33": "충북", "34": "충남", "35": "전북", "36": "전남", "37": "경북",
      "38": "경남", "39": "제주"
    };

    const PALETTE = ["#fca5a5", "#fdba74", "#fde047", "#86efac", "#7dd3fc", "#c4b5fd", "#f9a8d4"];
    // 색칠은 "누구와 갔는지(동행)"로 구분합니다. 동행 목록은 지도마다 바꿀 수 있어요.
    const DEFAULT_GROUPS = [
      { id: "three", label: "셋이서", color: "#fdba74" },
      { id: "parents", label: "부모님과", color: "#86efac" },
      { id: "family", label: "가족들과", color: "#7dd3fc" }
    ];
    const STICKERS = ["📍", "❤️", "⭐", "📸", "🍜", "☕", "🍦", "🏖️", "⛰️", "🏕️", "🎡", "🏯", "🌸", "🍁", "⛄", "🚂", "✈️", "🐟", "🎂", "👶"];

    /* ===== 저장 ===== */
    function emptyState() {
      return { title: DEFAULT_TITLE, groups: DEFAULT_GROUPS.map(g => ({ ...g })), regions: {}, stickers: [] };
    }

    function isValidState(s) {
      return s && typeof s === "object" && s.regions && typeof s.regions === "object" && Array.isArray(s.stickers);
    }

    // 공유 지도는 방마다 따로 이 기기에 캐시하고, 개인 지도는 그대로 둡니다
    const ROOM_KEY = "dohaTravelMap.room";
    let room = new URLSearchParams(location.search).get("room") || storageGet(ROOM_KEY);
    if (room) storageSet(ROOM_KEY, room);

    function storageGet(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }

    function storageSet(key, value) {
      try {
        if (value == null) localStorage.removeItem(key);
        else localStorage.setItem(key, value);
      } catch (e) { /* 무시 */ }
    }

    function cacheKey() {
      return room ? `${STORE_KEY}:room:${room}` : STORE_KEY;
    }

    function load() {
      try {
        const s = JSON.parse(localStorage.getItem(cacheKey()));
        if (isValidState(s)) return s;
      } catch (e) { /* 저장소를 못 쓰는 환경이면 새로 시작 */ }
      return emptyState();
    }

    function save() {
      storageSet(cacheKey(), JSON.stringify(state));
    }

    let state = load();
    let mode = "paint";
    let brush = DEFAULT_GROUPS[0].id;
    let selectedEmoji = STICKERS[0];
    let zoomK = 1;

    /* ===== 지역 만들기 =====
       통계청 2013 경계를 여행용으로 다듬습니다.
       - 일반구(수원시 장안구 등)는 시 단위로 합침
       - 청원군은 2014년 통합된 청주시로 합침
       - 군위군은 2023년 편입된 대구로 분류 */
    // 출처: https://github.com/southkorea/southkorea-maps (커밋 고정)
    const TOPO_URL = "https://raw.githubusercontent.com/southkorea/southkorea-maps/fe65e05e549d04083e52f380a7e9166a8ea0a01e/kostat/2013/json/skorea_municipalities_topo_simple.json";
    let topo;
    try {
      topo = await (await fetch(TOPO_URL)).json();
    } catch (e) {
      document.getElementById("hint").textContent = "지도를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.";
      throw e;
    }
    const geoms = topo.objects.skorea_municipalities_geo.geometries;

    function regionKey(p) {
      const c = p.code;
      if (c === "33310") return { id: "33010", name: "청주시" };
      if (["31", "33", "34", "35", "37", "38"].includes(c.slice(0, 2)) && c[4] !== "0") {
        const m = p.name.match(/^(.+?시)/);
        return { id: c.slice(0, 4) + "0", name: m ? m[1] : p.name };
      }
      return { id: c, name: p.name };
    }

    function provOf(code) {
      return code === "37310" ? "22" : code.slice(0, 2);
    }

    const regions = Array.from(d3.group(geoms, g => regionKey(g.properties).id), ([id, gs]) => {
      const { name } = regionKey(gs[0].properties);
      const prov = provOf(id);
      return {
        type: "Feature",
        id,
        properties: { id, name, prov, label: `${PROVINCES[prov]} ${name}` },
        geometry: topojson.merge(topo, gs)
      };
    });
    const regionById = new Map(regions.map(r => [r.id, r]));

    /* ===== 지도 그리기 ===== */
    const projection = d3.geoMercator().fitExtent([[24, 24], [W - 24, H - 64]], { type: "FeatureCollection", features: regions });
    const path = d3.geoPath(projection);

    const svg = d3.select("#map").attr("viewBox", `0 0 ${W} ${H}`);
    const defs = svg.append("defs");
    const gRoot = svg.append("g");
    const gRegions = gRoot.append("g");
    const gBorders = gRoot.append("g");
    const gLabels = gRoot.append("g").attr("class", "labels");
    const gStickers = gRoot.append("g");

    gRegions.selectAll("path")
      .data(regions)
      .join("path")
      .attr("class", "region")
      .attr("d", path)
      .attr("stroke", "#ffffff")
      .attr("stroke-width", 0.6)
      .attr("vector-effect", "non-scaling-stroke")
      .on("mousemove", (e, d) => showTip(e, regionTip(d)))
      .on("mouseleave", hideTip);

    const obj = topo.objects.skorea_municipalities_geo;
    gBorders.append("path")
      .datum(topojson.mesh(topo, obj, (a, b) => a !== b && provOf(a.properties.code) !== provOf(b.properties.code)))
      .attr("d", path)
      .attr("fill", "none")
      .attr("stroke", "#c9ad94")
      .attr("stroke-width", 1.3)
      .attr("vector-effect", "non-scaling-stroke")
      .attr("pointer-events", "none");
    gBorders.append("path")
      .datum(topojson.mesh(topo, obj, (a, b) => a === b))
      .attr("d", path)
      .attr("fill", "none")
      .attr("stroke", "#b79a80")
      .attr("stroke-width", 1)
      .attr("vector-effect", "non-scaling-stroke")
      .attr("pointer-events", "none");

    /* ===== 지역 이름 =====
       전체 화면에서는 시·도 이름, 확대하면 화면에 충분히 크게 보이는 시·군·구 이름을 보여 줍니다. */
    function labelPoint(feature) {
      // 섬이 많은 지역은 가장 큰 땅덩이 가운데에 이름을 둡니다
      const g = feature.geometry;
      if (g.type !== "MultiPolygon") return path.centroid(feature);
      const parts = g.coordinates.map(c => ({ type: "Polygon", coordinates: c }));
      return path.centroid(parts.reduce((a, b) => (path.area(a) >= path.area(b) ? a : b)));
    }

    const muniLabels = regions.map(r => ({ name: r.properties.name, xy: labelPoint(r), area: path.area(r) }));
    // 서울을 둘러싼 경기는 가운데가 서울이라 이름을 북동쪽에 둡니다
    const PROV_LABEL_AT = { "31": [127.3, 37.95] };
    const provLabels = Object.entries(PROVINCES).map(([code, name]) => {
      if (PROV_LABEL_AT[code]) return { name, xy: projection(PROV_LABEL_AT[code]) };
      const merged = { type: "Feature", geometry: topojson.merge(topo, geoms.filter(g => provOf(g.properties.code) === code)) };
      return { name, xy: labelPoint(merged) };
    });

    const PROV_LABEL_MAX_K = 2.2;
    const MUNI_LABEL_MIN_SCREEN_AREA = 2200;

    gLabels.selectAll("text.prov-label").data(provLabels).join("text").attr("class", "prov-label").text(d => d.name);
    gLabels.selectAll("text.muni-label").data(muniLabels).join("text").attr("class", "muni-label").text(d => d.name);

    function updateLabels() {
      const t = d => `translate(${d.xy[0]},${d.xy[1]}) scale(${1 / zoomK})`;
      gLabels.selectAll("text.prov-label")
        .attr("transform", t)
        .attr("display", zoomK < PROV_LABEL_MAX_K ? null : "none");
      gLabels.selectAll("text.muni-label")
        .attr("transform", t)
        .attr("display", d => (zoomK >= PROV_LABEL_MAX_K && d.area * zoomK * zoomK >= MUNI_LABEL_MIN_SCREEN_AREA ? null : "none"));
    }
    updateLabels();

    /* ===== 확대/이동 ===== */
    const zoom = d3.zoom()
      .scaleExtent([1, 14])
      .translateExtent([[0, 0], [W, H]])
      .clickDistance(5)
      .on("zoom", e => {
        zoomK = e.transform.k;
        gRoot.attr("transform", e.transform);
        gStickers.selectAll("g.sticker").attr("transform", stickerTransform);
        updateLabels();
        hideTip();
      });

    svg.call(zoom).on("dblclick.zoom", null);
    svg.on("click", onMapClick);

    document.getElementById("zoomIn").onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1.6);
    document.getElementById("zoomOut").onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.6);
    document.getElementById("zoomReset").onclick = () => svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity);

    function zoomToPoint([x, y], k) {
      const t = d3.zoomIdentity.translate(W / 2, H / 2).scale(k).translate(-x, -y);
      svg.transition().duration(600).call(zoom.transform, t);
    }

    function zoomToRegion(r) {
      zoomToBounds(path.bounds(r));
    }

    function zoomToBounds([[x0, y0], [x1, y1]]) {
      const k = Math.max(1, Math.min(8, 0.6 / Math.max((x1 - x0) / W, (y1 - y0) / H)));
      zoomToPoint([(x0 + x1) / 2, (y0 + y1) / 2], k);
    }

    /* ===== 스티커 ===== */
    function stickerXY(d) {
      return projection([d.lng, d.lat]);
    }

    function stickerTransform(d) {
      const [x, y] = stickerXY(d);
      return `translate(${x},${y}) scale(${1 / zoomK})`;
    }

    const drag = d3.drag()
      .clickDistance(4)
      .subject((e, d) => {
        const [x, y] = stickerXY(d);
        return { x, y };
      })
      .on("start", function () {
        d3.select(this).raise().classed("dragging", true);
        hideTip();
      })
      .on("drag", function (e, d) {
        [d.lng, d.lat] = projection.invert([e.x, e.y]);
        d.moved = true;
        d3.select(this).attr("transform", stickerTransform);
      })
      .on("end", function (e, d) {
        d3.select(this).classed("dragging", false);
        if (d.moved) {
          delete d.moved;
          setSticker(d);
        }
      });

    function renderStickers() {
      gStickers.selectAll("g.sticker")
        .data(state.stickers, d => d.id)
        .join(enter => {
          const g = enter.append("g").attr("class", "sticker");
          g.append("circle")
            .attr("r", 17)
            .attr("fill", "#ffffff")
            .attr("stroke", "#e7d6c5")
            .attr("stroke-width", 1.5);
          g.append("text")
            .attr("text-anchor", "middle")
            .attr("dy", "0.35em")
            .attr("font-size", 19)
            .attr("font-family", "'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif");
          g.call(drag)
            .on("click", (e, d) => {
              e.stopPropagation();
              openStickerDialog(d, false);
            })
            .on("mousemove", (e, d) => showTip(e, d.name || "이름 없는 장소"))
            .on("mouseleave", hideTip);
          return g;
        })
        .attr("transform", stickerTransform)
        .select("text")
        .text(d => d.emoji);
    }

    /* ===== 지도 클릭 ===== */
    function onMapClick(e) {
      const region = e.target.classList.contains("region") ? e.target.__data__ : null;

      if (mode === "paint") {
        if (region) paintRegion(region);
        return;
      }

      const [lng, lat] = projection.invert(d3.pointer(e, gRoot.node()));
      openStickerDialog({
        id: null,
        emoji: selectedEmoji,
        lng,
        lat,
        regionId: region ? region.id : null,
        name: "",
        date: today(),
        memo: ""
      }, true);
    }

    function paintRegion(r) {
      const cur = state.regions[r.id];
      const label = r.properties.label;

      if (brush === "eraser") {
        if (cur) {
          const n = visitsOf(cur).length;
          if (n > 1 && !confirm(`${label}의 다녀온 기록 ${n}개를 모두 지울까요?`)) return;
          setRegion(r.id, null);
          toast(`${label} 색을 지웠어요`);
        }
        return;
      }

      // 이미 칠한 지역은 방문 기록 목록을 열어 또 다녀온 기록을 더할 수 있게
      if (cur) {
        openRegionDialog(r);
        return;
      }

      // 색칠만 할 때는 날짜를 비워 두고, 날짜·메모를 남겨야 여행 기록에 올라갑니다
      putVisit(r.id, { id: uid(), group: brush, date: "", memo: "" });
      toast(`${label} 색칠 완료! 다시 누르면 날짜·메모를 남겨 여행 기록에 올릴 수 있어요`);
    }

    /* ===== 대화상자 ===== */
    const regionDlg = document.getElementById("regionDlg");
    const stickerDlg = document.getElementById("stickerDlg");
    let editingRegion = null;
    let editingSticker = null;

    function fillPickRow(el, items, current, name, makeLabel) {
      el.innerHTML = "";
      items.forEach(v => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = name === "color" ? "swatch" : "emoji-btn";
        if (name === "color") b.style.background = v;
        else b.textContent = v;
        b.title = makeLabel ? makeLabel(v) : v;
        b.classList.toggle("on", v === current);
        b.onclick = () => {
          el.dataset.value = v;
          el.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
        };
        el.appendChild(b);
      });
      el.dataset.value = current;
    }

    const rdForm = document.getElementById("rdForm");
    const rdList = document.getElementById("rdList");
    const rdEdit = document.getElementById("rdEdit");
    let editingVisit = null;

    function openRegionDialog(r, visitId) {
      editingRegion = r;
      document.getElementById("rdTitle").textContent = r.properties.label;
      const visit = visitId && visitsOf(state.regions[r.id]).find(v => v.id === visitId);
      const visits = state.regions[r.id] ? visitsOf(state.regions[r.id]) : [];
      // 아직 아무것도 적지 않은 방문 하나뿐이면 목록 대신 바로 적는 화면으로
      if (visit) showVisitEdit(visit, false);
      else if (visits.length === 1 && !hasNote(visits[0])) showVisitEdit(visits[0], false);
      else showVisitList();
      if (!regionDlg.open) regionDlg.showModal();
    }

    function showVisitList() {
      const r = editingRegion;
      const visits = state.regions[r.id] ? visitsOf(state.regions[r.id]) : [];
      if (!visits.length) {
        regionDlg.close();
        return;
      }
      rdList.hidden = false;
      rdEdit.hidden = true;
      document.getElementById("rdCount").textContent = `${visits.length}번 다녀왔어요 · 기록을 누르면 고칠 수 있어요`;
      const ul = document.getElementById("rdVisits");
      ul.innerHTML = "";
      visits.forEach(v => {
        const li = recordItem({ kind: "visit", r, v });
        li.querySelector(".rec-title").textContent = v.date || (v.memo ? "날짜 없음" : "아직 기록 없음 · 눌러서 남기기");
        li.querySelector(".rec-sub").textContent = groupOfVisit(v) ? groupOfVisit(v).label : "";
        li.onclick = () => showVisitEdit(v, false);
        ul.appendChild(li);
      });
    }

    function showVisitEdit(v, isNew) {
      editingVisit = { v, isNew };
      rdList.hidden = true;
      rdEdit.hidden = false;
      document.getElementById("rdEditSub").textContent = isNew ? "또 다녀왔군요! 누구와 다녀왔나요?" : "누구와 다녀왔나요?";
      const picker = document.getElementById("rdGroups");
      picker.innerHTML = "";
      const current = groupById(v.group) ? v.group : groupsOf()[0].id;
      groupsOf().forEach(g => {
        const b = groupButton(g);
        b.classList.toggle("on", g.id === current);
        b.onclick = () => picker.querySelectorAll(".group-btn").forEach(x => x.classList.toggle("on", x === b));
        picker.appendChild(b);
      });
      rdForm.date.value = v.date || "";
      rdForm.memo.value = v.memo || "";
      document.getElementById("rdDelete").style.display = isNew ? "none" : "";
    }

    document.getElementById("rdAdd").onclick = () => {
      showVisitEdit({ id: uid(), group: brush === "eraser" ? groupsOf()[0].id : brush, date: "", memo: "" }, true);
    };

    document.getElementById("rdBack").onclick = () => showVisitList();

    document.getElementById("rdSave").onclick = () => {
      const r = editingRegion;
      const { v, isNew } = editingVisit;
      const group = document.querySelector("#rdGroups .group-btn.on").dataset.value;
      const next = { ...v, group, date: rdForm.date.value, memo: rdForm.memo.value.trim() };
      delete next.color;
      putVisit(r.id, next);
      toast(isNew ? `${r.properties.label}에 다녀온 기록을 더했어요` : "기록을 저장했어요");
      showVisitList();
    };

    document.getElementById("rdDelete").onclick = () => {
      if (!confirm("이 기록을 지울까요?")) return;
      removeVisit(editingRegion.id, editingVisit.v.id);
      showVisitList();
    };

    document.getElementById("rdClear").onclick = () => {
      const r = editingRegion;
      const n = visitsOf(state.regions[r.id]).length;
      if (!confirm(`${r.properties.label}의 다녀온 기록 ${n}개를 모두 지울까요?`)) return;
      setRegion(r.id, null);
      toast(`${r.properties.label} 색을 지웠어요`);
      regionDlg.close();
    };

    regionDlg.addEventListener("close", () => {
      editingRegion = null;
      editingVisit = null;
    });

    function openStickerDialog(s, isNew) {
      editingSticker = { data: s, isNew };
      const region = s.regionId ? regionById.get(s.regionId) : null;
      document.getElementById("sdTitle").textContent = isNew ? "스티커 붙이기" : (s.name || "이름 없는 장소");
      document.getElementById("sdSub").textContent = region ? region.properties.label : "바다 위 어딘가";
      document.getElementById("sdDelete").style.display = isNew ? "none" : "";
      stickerDlg.querySelector('button[value="save"]').textContent = isNew ? "붙이기" : "저장";
      fillPickRow(document.getElementById("sdEmojis"), STICKERS, s.emoji, "emoji");
      const f = stickerDlg.querySelector("form");
      f.name.value = s.name || "";
      f.date.value = s.date || "";
      f.memo.value = s.memo || "";
      stickerDlg.returnValue = "";
      stickerDlg.showModal();
      if (isNew) f.name.focus();
    }

    stickerDlg.addEventListener("close", () => {
      if (!editingSticker) return;
      const { data: s, isNew } = editingSticker;
      const f = stickerDlg.querySelector("form");
      editingSticker = null;

      if (stickerDlg.returnValue === "save") {
        s.emoji = document.getElementById("sdEmojis").dataset.value;
        s.name = f.name.value.trim();
        s.date = f.date.value;
        s.memo = f.memo.value.trim();
        if (isNew) s.id = uid();
        setSticker(s);
        if (isNew) {
          // 스티커를 붙인 지역이 비어 있으면 같이 색칠
          if (s.regionId && !state.regions[s.regionId]) {
            putVisit(s.regionId, { id: uid(), group: brush === "eraser" ? groupsOf()[0].id : brush, date: "", memo: "" });
          }
          toast("스티커를 붙였어요! 끌어서 위치를 옮길 수 있어요");
        }
      } else if (stickerDlg.returnValue === "delete") {
        removeSticker(s.id);
        toast("스티커를 떼어냈어요");
      }
    });

    /* ===== 도구 막대 ===== */
    const paintTray = document.getElementById("paintTray");
    const stickerTray = document.getElementById("stickerTray");

    function groupButton(g) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "group-btn";
      b.dataset.value = g.id;
      const dot = document.createElement("i");
      dot.style.background = g.color;
      b.append(dot, g.label);
      return b;
    }

    function renderPaintTray() {
      paintTray.innerHTML = "";
      groupsOf().forEach(g => paintTray.appendChild(groupButton(g)));
      const eraser = document.createElement("button");
      eraser.className = "swatch eraser";
      eraser.dataset.value = "eraser";
      eraser.textContent = "🧽";
      eraser.title = "지우개";
      const edit = document.createElement("button");
      edit.className = "group-btn edit";
      edit.dataset.action = "edit";
      edit.textContent = "✏️ 편집";
      paintTray.append(eraser, edit);
      if (brush !== "eraser" && !groupById(brush)) brush = groupsOf()[0].id;
      syncTools();
    }

    function buildTrays() {
      STICKERS.forEach(s => {
        const b = document.createElement("button");
        b.className = "emoji-btn";
        b.dataset.value = s;
        b.textContent = s;
        stickerTray.appendChild(b);
      });

      paintTray.onclick = e => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.action === "edit") return openGroupDialog();
        brush = b.dataset.value;
        syncTools();
      };
      stickerTray.onclick = e => {
        const b = e.target.closest("button");
        if (!b) return;
        selectedEmoji = b.dataset.value;
        syncTools();
      };
      document.querySelectorAll(".modes button").forEach(b => {
        b.onclick = () => {
          mode = b.dataset.mode;
          syncTools();
        };
      });
    }

    function syncTools() {
      document.querySelectorAll(".modes button").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
      paintTray.classList.toggle("hidden", mode !== "paint");
      stickerTray.classList.toggle("hidden", mode !== "sticker");
      paintTray.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.value === brush));
      stickerTray.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.value === selectedEmoji));
      document.getElementById("hint").textContent = mode === "paint"
        ? (brush === "eraser" ? "지울 지역을 눌러 주세요" : `‘${groupById(brush).label}’ 다녀온 지역을 눌러 색칠해요 · 칠한 곳을 누르면 기록 보기·또 다녀온 기록 더하기`)
        : `${selectedEmoji} 다녀온 장소를 눌러 스티커를 붙여요 · 붙인 스티커는 끌어서 옮길 수 있어요`;
    }

    /* ===== 동행(누구와) ===== */
    function groupsOf() {
      return state.groups && state.groups.length ? state.groups : DEFAULT_GROUPS;
    }

    function groupById(id) {
      return groupsOf().find(g => g.id === id);
    }

    /* 지역 기록 = { visits: { 방문id: { id, group, date, memo } } }
       예전 기록({ groups, date, memo } 또는 색만 저장한 { color, date, memo })은 방문 목록으로 읽고,
       고칠 때 새 형식으로 바꿔 저장합니다. 색만 저장한 기록은 처음 기본 동행 중 같은 색으로 읽어서
       나중에 동행 색을 바꾸거나 추가해도 엉뚱한 동행으로 바뀌지 않게 합니다. */
    function visitsOf(rec) {
      let list;
      if (rec.visits) {
        list = Object.values(rec.visits);
      } else {
        const legacy = DEFAULT_GROUPS.find(g => g.color === rec.color);
        const groups = Array.isArray(rec.groups) ? rec.groups : legacy ? [legacy.id] : [];
        list = groups.length
          ? groups.map((group, i) => ({ id: `old${i}`, group, date: rec.date || "", memo: i === 0 ? rec.memo || "" : "" }))
          : [{ id: "old0", group: null, color: rec.color || LAND, date: rec.date || "", memo: rec.memo || "" }];
      }
      return list.sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.id.localeCompare(a.id));
    }

    // 날짜나 메모를 남긴 방문만 여행 기록 목록에 보입니다
    function hasNote(v) {
      return Boolean(v.date || v.memo);
    }

    function groupOfVisit(v) {
      return groupById(v.group);
    }

    function recGroups(rec) {
      const used = new Set(visitsOf(rec).map(v => v.group));
      return groupsOf().filter(g => used.has(g.id)).map(g => g.id);
    }

    function groupNames(rec) {
      return recGroups(rec).map(id => groupById(id).label).join(" · ");
    }

    function recColors(rec) {
      const colors = recGroups(rec).map(id => groupById(id).color);
      if (colors.length) return colors;
      const legacy = visitsOf(rec).map(v => v.color).filter(Boolean);
      return legacy.length ? [...new Set(legacy)] : [LAND];
    }

    function fillFor(rec) {
      const colors = recColors(rec);
      return colors.length === 1 ? colors[0] : `url(#${stripePattern(colors)})`;
    }

    function cssFill(rec) {
      const colors = recColors(rec);
      if (colors.length === 1) return colors[0];
      const step = 100 / colors.length;
      return `linear-gradient(135deg, ${colors.map((c, i) => `${c} ${i * step}% ${(i + 1) * step}%`).join(", ")})`;
    }

    // 여러 동행과 간 지역은 동행 색을 번갈아 칠한 줄무늬로
    function stripePattern(colors) {
      const id = "stripe-" + colors.map(c => c.replace(/[^0-9a-z]/gi, "")).join("-");
      if (defs.select(`#${id}`).empty()) {
        const w = 3.5;
        const p = defs.append("pattern")
          .attr("id", id)
          .attr("patternUnits", "userSpaceOnUse")
          .attr("width", w * colors.length)
          .attr("height", w * colors.length)
          .attr("patternTransform", "rotate(45)");
        colors.forEach((c, i) => p.append("rect").attr("x", i * w).attr("width", w).attr("height", w * colors.length).attr("fill", c));
      }
      return id;
    }

    function setGroups(groups) {
      state.groups = groups;
      commit();
      remote.update(() => ({ groups }));
    }

    const groupDlg = document.getElementById("groupDlg");
    let groupDraft = [];

    function renderGroupRows() {
      const box = document.getElementById("gdRows");
      box.innerHTML = "";
      groupDraft.forEach((g, i) => {
        const row = document.createElement("div");
        row.className = "group-row";
        const sw = document.createElement("button");
        sw.type = "button";
        sw.className = "swatch";
        sw.style.background = g.color;
        sw.title = "눌러서 색 바꾸기";
        sw.onclick = () => {
          g.color = PALETTE[(PALETTE.indexOf(g.color) + 1) % PALETTE.length];
          sw.style.background = g.color;
        };
        const input = document.createElement("input");
        input.value = g.label;
        input.maxLength = 12;
        input.placeholder = "예) 친구들과";
        input.oninput = () => { g.label = input.value; };
        const del = document.createElement("button");
        del.type = "button";
        del.className = "del";
        del.textContent = "✕";
        del.title = "삭제";
        del.onclick = () => {
          groupDraft.splice(i, 1);
          renderGroupRows();
        };
        row.append(sw, input, del);
        box.appendChild(row);
      });
    }

    function openGroupDialog() {
      groupDraft = groupsOf().map(g => ({ ...g }));
      renderGroupRows();
      groupDlg.returnValue = "";
      groupDlg.showModal();
    }

    document.getElementById("gdAdd").onclick = () => {
      const used = new Set([...groupDraft.map(g => g.color), ...Object.values(state.regions).map(r => r.color).filter(Boolean)]);
      groupDraft.push({ id: uid(), label: "", color: PALETTE.find(c => !used.has(c)) || PALETTE[0] });
      renderGroupRows();
      document.querySelector("#gdRows .group-row:last-child input").focus();
    };

    groupDlg.addEventListener("close", () => {
      if (groupDlg.returnValue !== "save") return;
      const groups = groupDraft.map(g => ({ ...g, label: g.label.trim() })).filter(g => g.label);
      if (!groups.length) {
        alert("동행이 하나는 있어야 해요.");
        return;
      }
      setGroups(groups);
      toast("동행 목록을 저장했어요");
    });

    /* ===== 패널 ===== */
    function renderPanel() {
      const visited = regions.filter(r => state.regions[r.id]);
      const pct = Math.round((visited.length / regions.length) * 100);
      const visitedProv = new Set(visited.map(r => r.properties.prov));

      document.getElementById("statRegions").innerHTML =
        `${visited.length}<small> / ${regions.length} 시·군·구 (${pct}%)</small>`;
      document.getElementById("statBar").style.width = `${pct}%`;
      document.getElementById("summary").innerHTML =
        `시·도 <b>${visitedProv.size}</b>/17 · 시·군·구 <b>${visited.length}</b> · 방문 <b>${d3.sum(visited, r => visitsOf(state.regions[r.id]).length)}</b>번 · 스티커 <b>${state.stickers.length}</b>개`;

      const groupStats = document.getElementById("groupStats");
      groupStats.innerHTML = "";
      groupsOf().forEach(g => {
        const n = visited.filter(r => recGroups(state.regions[r.id]).includes(g.id)).length;
        const span = document.createElement("span");
        const dot = document.createElement("i");
        dot.style.background = g.color;
        span.append(dot, `${g.label} ${n}곳`);
        groupStats.appendChild(span);
      });

      const chips = document.getElementById("provChips");
      chips.innerHTML = "";
      Object.entries(PROVINCES).forEach(([code, name]) => {
        const all = regions.filter(r => r.properties.prov === code);
        const done = all.filter(r => state.regions[r.id]).length;
        const b = document.createElement("button");
        b.className = "chip" + (done ? " on" : "");
        b.textContent = `${name} ${done}/${all.length}`;
        b.onclick = () => {
          const bounds = all.map(r => path.bounds(r));
          const x0 = d3.min(bounds, b => b[0][0]), y0 = d3.min(bounds, b => b[0][1]);
          const x1 = d3.max(bounds, b => b[1][0]), y1 = d3.max(bounds, b => b[1][1]);
          zoomToBounds([[x0, y0], [x1, y1]]);
        };
        chips.appendChild(b);
      });

      const items = [
        ...state.stickers.map(s => ({ kind: "sticker", date: s.date || "", s })),
        ...visited.flatMap(r => visitsOf(state.regions[r.id]).filter(hasNote).map(v => ({ kind: "visit", date: v.date || "", r, v })))
      ].sort((a, b) => b.date.localeCompare(a.date)); // 최신순 (날짜 없는 기록은 맨 뒤)

      const box = document.getElementById("records");
      box.innerHTML = "";
      if (!items.length) {
        box.innerHTML = '<p class="empty">아직 기록이 없어요. 색칠한 곳을 다시 눌러 날짜·메모를 남기면 여기에 쌓여요!</p>';
        return;
      }

      const listOf = its => {
        const ul = document.createElement("ul");
        ul.className = "records";
        its.forEach(it => ul.appendChild(recordItem(it)));
        return ul;
      };
      const moreBtn = (text, onclick) => {
        const b = document.createElement("button");
        b.className = "btn more-btn";
        b.textContent = text;
        b.onclick = onclick;
        return b;
      };

      if (!recordsExpanded || items.length <= RECENT_RECORDS) {
        box.appendChild(listOf(items.slice(0, RECENT_RECORDS)));
        if (items.length > RECENT_RECORDS) {
          box.appendChild(moreBtn(`더보기 · 연도별/지역별로 전체 ${items.length}개`, () => {
            recordsExpanded = true;
            renderPanel();
          }));
        }
        return;
      }

      // 연도별 또는 17개 시·도별로 묶어 보여 주고, 첫 묶음만 펼쳐 둡니다
      const tabs = document.createElement("div");
      tabs.className = "view-tabs";
      [["year", "연도별"], ["prov", "지역별"]].forEach(([view, text]) => {
        const b = document.createElement("button");
        b.textContent = text;
        b.classList.toggle("on", recordsView === view);
        b.onclick = () => {
          recordsView = view;
          renderPanel();
        };
        tabs.appendChild(b);
      });
      box.appendChild(tabs);

      const provOrder = Object.keys(PROVINCES);
      const groupsByView = recordsView === "year"
        ? d3.groups(items, it => (it.date ? it.date.slice(0, 4) : ""))
        : d3.groups(items, recordProv).sort((a, b) => (provOrder.indexOf(a[0]) + 1 || 99) - (provOrder.indexOf(b[0]) + 1 || 99));
      groupsByView.forEach(([key, its], i) => {
        const openKey = `${recordsView}:${key}`;
        const details = document.createElement("details");
        details.className = "year-group";
        details.open = i === 0 || openYears.has(openKey);
        details.ontoggle = () => (details.open ? openYears.add(openKey) : openYears.delete(openKey));
        const summary = document.createElement("summary");
        const name = document.createElement("span");
        name.textContent = recordsView === "year"
          ? (key ? `${key}년` : "날짜 없음")
          : (PROVINCES[key] ? PROVINCE_NAMES[key] : "지역 없음");
        const count = document.createElement("small");
        count.textContent = `${its.length}개`;
        name.appendChild(count);
        summary.appendChild(name);
        details.append(summary, listOf(its));
        box.appendChild(details);
      });
      box.appendChild(moreBtn("접기", () => {
        recordsExpanded = false;
        renderPanel();
      }));
    }

    const RECENT_RECORDS = 3;
    let recordsExpanded = false;
    let recordsView = "year";

    const PROVINCE_NAMES = {
      "11": "서울특별시", "21": "부산광역시", "22": "대구광역시", "23": "인천광역시", "24": "광주광역시",
      "25": "대전광역시", "26": "울산광역시", "29": "세종특별자치시", "31": "경기도", "32": "강원특별자치도",
      "33": "충청북도", "34": "충청남도", "35": "전북특별자치도", "36": "전라남도", "37": "경상북도",
      "38": "경상남도", "39": "제주특별자치도"
    };

    function recordProv(it) {
      const region = it.kind === "sticker" ? (it.s.regionId && regionById.get(it.s.regionId)) : it.r;
      return region ? region.properties.prov : "";
    }
    const openYears = new Set();

    function recordItem(it) {
      const li = document.createElement("li");
      const icon = document.createElement("div");
      icon.className = "rec-icon";
      const body = document.createElement("div");
      body.className = "rec-body";
      const title = document.createElement("div");
      title.className = "rec-title";
      const sub = document.createElement("div");
      sub.className = "rec-sub";
      const memo = document.createElement("div");
      memo.className = "rec-memo";

      if (it.kind === "sticker") {
        const s = it.s;
        const region = s.regionId ? regionById.get(s.regionId) : null;
        icon.textContent = s.emoji;
        icon.style.background = "#fff1e0";
        title.textContent = s.name || "이름 없는 장소";
        sub.textContent = [region && region.properties.label, s.date].filter(Boolean).join(" · ");
        memo.textContent = s.memo || "";
        li.onclick = () => {
          zoomToPoint(stickerXY(s), Math.max(zoomK, 5));
          openStickerDialog(s, false);
        };
      } else {
        const g = groupOfVisit(it.v);
        icon.style.background = g ? g.color : it.v.color || LAND;
        title.textContent = it.r.properties.label;
        sub.textContent = [g && g.label, it.v.date || "날짜 없음"].filter(Boolean).join(" · ");
        memo.textContent = it.v.memo || "";
        li.onclick = () => {
          zoomToRegion(it.r);
          openRegionDialog(it.r, it.v.id);
        };
      }

      body.append(title, sub);
      if (memo.textContent) body.append(memo);
      li.append(icon, body);
      return li;
    }

    function renderRegions() {
      gRegions.selectAll("path.region").attr("fill", d => (state.regions[d.id] ? fillFor(state.regions[d.id]) : LAND));
    }

    function render() {
      if (OLD_DEFAULT_TITLES.includes(state.title)) state.title = DEFAULT_TITLE;
      document.getElementById("title").textContent = state.title || DEFAULT_TITLE;
      document.title = state.title || DEFAULT_TITLE;
      renderPaintTray();
      renderRegions();
      renderStickers();
      renderPanel();
    }

    function commit() {
      save();
      render();
    }

    /* ===== 기록 바꾸기 (공유 중이면 바뀐 부분만 서버에도 보냄) ===== */
    function setRegion(id, rec) {
      if (rec) state.regions[id] = rec;
      else delete state.regions[id];
      commit();
      remote.update(fs => ({ [`regions.${id}`]: rec || fs.deleteField() }));
    }

    function putVisit(id, v) {
      const cur = state.regions[id];
      if (cur && cur.visits) {
        cur.visits[v.id] = v;
        commit();
        remote.update(() => ({ [`regions.${id}.visits.${v.id}`]: v }));
        return;
      }
      // 처음 칠하거나 예전 형식이면 지역 기록 전체를 새 형식으로 저장
      const visits = Object.fromEntries((cur ? visitsOf(cur) : []).map(x => [x.id, x]));
      visits[v.id] = v;
      setRegion(id, { visits });
    }

    function removeVisit(id, visitId) {
      const cur = state.regions[id];
      const left = visitsOf(cur).filter(x => x.id !== visitId);
      if (!left.length) return setRegion(id, null);
      if (cur.visits) {
        delete cur.visits[visitId];
        commit();
        remote.update(fs => ({ [`regions.${id}.visits.${visitId}`]: fs.deleteField() }));
      } else {
        setRegion(id, { visits: Object.fromEntries(left.map(x => [x.id, x])) });
      }
    }

    function plainSticker(s) {
      const { id, emoji, lng, lat, regionId, name, date, memo } = s;
      return { id, emoji, lng, lat, regionId: regionId || null, name: name || "", date: date || "", memo: memo || "" };
    }

    function setSticker(s) {
      const i = state.stickers.findIndex(x => x.id === s.id);
      if (i < 0) state.stickers.push(s);
      else state.stickers[i] = s;
      commit();
      remote.update(() => ({ [`stickers.${s.id}`]: plainSticker(s) }));
    }

    function removeSticker(id) {
      state.stickers = state.stickers.filter(x => x.id !== id);
      commit();
      remote.update(fs => ({ [`stickers.${id}`]: fs.deleteField() }));
    }

    function replaceAll(next) {
      state = next;
      commit();
      remote.replace();
    }

    /* ===== 제목 ===== */
    const titleEl = document.getElementById("title");
    titleEl.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        titleEl.blur();
      }
    });
    titleEl.addEventListener("blur", () => {
      const title = titleEl.textContent.trim() || DEFAULT_TITLE;
      if (title === state.title) return;
      state.title = title;
      commit();
      remote.update(() => ({ title }));
    });

    /* ===== 백업 / 이미지 ===== */
    function download(blob, filename) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    document.getElementById("btnExport").onclick = () => {
      download(new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }), `travel-map-${today()}.json`);
      toast("백업 파일을 저장했어요. 다른 기기에서 '백업 불러오기'로 열 수 있어요");
    };

    const fileInput = document.getElementById("fileInput");
    document.getElementById("btnImport").onclick = () => fileInput.click();
    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      fileInput.value = "";
      if (!file) return;
      try {
        const s = JSON.parse(await file.text());
        if (!isValidState(s)) throw new Error("형식 오류");
        if (!confirm("지금 지도를 백업 파일 내용으로 바꿀까요?")) return;
        replaceAll(s);
        toast("백업을 불러왔어요");
      } catch (e) {
        alert("여행 지도 백업 파일이 아니에요.");
      }
    };

    document.getElementById("btnReset").onclick = () => {
      if (!confirm("색칠과 스티커를 모두 지울까요? (먼저 '백업 저장'을 권해요)")) return;
      replaceAll(emptyState());
    };

    document.getElementById("btnPng").onclick = exportPng;

    function exportPng() {
      const clone = svg.node().cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clone.setAttribute("width", W);
      clone.setAttribute("height", H);
      clone.querySelector("g").removeAttribute("transform");
      clone.querySelector("g.labels").remove();

      // 화면 확대 상태와 관계없이 전체 지도 + 보기 좋은 스티커 크기로
      const originals = gStickers.selectAll("g.sticker").nodes();
      clone.querySelectorAll("g.sticker").forEach((n, i) => {
        const [x, y] = stickerXY(originals[i].__data__);
        n.setAttribute("transform", `translate(${x},${y}) scale(0.8)`);
      });

      const ns = "http://www.w3.org/2000/svg";
      const bg = document.createElementNS(ns, "rect");
      bg.setAttribute("width", W);
      bg.setAttribute("height", H);
      bg.setAttribute("fill", "#eaf5fb");
      clone.insertBefore(bg, clone.firstChild);

      const font = "'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif";
      const visited = regions.filter(r => state.regions[r.id]).length;
      [[state.title || DEFAULT_TITLE, 44, 30, 800], [`시·군·구 ${visited}곳 · 스티커 ${state.stickers.length}개`, 76, 17, 500]]
        .forEach(([text, y, size, weight]) => {
          const t = document.createElementNS(ns, "text");
          t.setAttribute("x", 28);
          t.setAttribute("y", y);
          t.setAttribute("font-size", size);
          t.setAttribute("font-weight", weight);
          t.setAttribute("font-family", font);
          t.setAttribute("fill", "#3f2d20");
          t.textContent = text;
          clone.appendChild(t);
        });

      // 동행 색 범례
      let lx = 28;
      groupsOf().forEach(g => {
        const c = document.createElementNS(ns, "circle");
        c.setAttribute("cx", lx + 7);
        c.setAttribute("cy", 101);
        c.setAttribute("r", 7);
        c.setAttribute("fill", g.color);
        const t = document.createElementNS(ns, "text");
        t.setAttribute("x", lx + 20);
        t.setAttribute("y", 107);
        t.setAttribute("font-size", 16);
        t.setAttribute("font-family", font);
        t.setAttribute("fill", "#3f2d20");
        t.textContent = g.label;
        clone.append(c, t);
        lx += 34 + g.label.length * 16;
      });

      const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)], { type: "image/svg+xml" }));
      const img = new Image();
      img.onload = () => {
        const scale = 2;
        const canvas = document.createElement("canvas");
        canvas.width = W * scale;
        canvas.height = H * scale;
        const ctx = canvas.getContext("2d");
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0, W, H);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob => download(blob, `travel-map-${today()}.png`), "image/png");
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        alert("이미지를 만들지 못했어요. 화면 캡처를 이용해 주세요.");
      };
      img.src = url;
    }

    /* ===== 함께 쓰기 (Firebase Firestore) =====
       maps/{방 코드} 문서 하나에 지도 전체를 두고, 바뀐 지역·스티커 칸만 고쳐 써서
       두 사람이 동시에 고쳐도 서로의 기록을 덮어쓰지 않게 합니다. */
    const FIREBASE_SDK = "https://www.gstatic.com/firebasejs/10.12.2";
    const remote = {
      fs: null,
      ref: null,
      unsub: null,
      status: "off",
      update(makeFields) {
        if (!this.ref) return;
        this.fs.updateDoc(this.ref, { ...makeFields(this.fs), updatedAt: this.fs.serverTimestamp() }).catch(onRemoteError);
      },
      replace() {
        if (!this.ref) return;
        this.fs.setDoc(this.ref, toRemote(state)).catch(onRemoteError);
      }
    };

    function toRemote(st) {
      return {
        title: st.title || DEFAULT_TITLE,
        groups: groupsOf(),
        regions: st.regions,
        stickers: Object.fromEntries(st.stickers.map(s => [s.id, plainSticker(s)])),
        updatedAt: remote.fs.serverTimestamp()
      };
    }

    function fromRemote(d) {
      return {
        title: d.title || DEFAULT_TITLE,
        groups: d.groups || null,
        regions: d.regions || {},
        stickers: Object.values(d.stickers || {}).sort((a, b) => a.id.localeCompare(b.id))
      };
    }

    async function loadFirebaseConfig() {
      try {
        return (await import("./firebase-config.js")).default || null;
      } catch (e) {
        return null;
      }
    }

    function onRemoteError(e) {
      console.error(e);
      setShareStatus("error");
    }

    async function connectRoom(code, seed) {
      const config = await loadFirebaseConfig();
      if (!config) {
        setShareStatus("nocfg");
        return;
      }
      setShareStatus("wait");
      try {
        const [{ initializeApp, getApps }, fs] = await Promise.all([
          import(`${FIREBASE_SDK}/firebase-app.js`),
          import(`${FIREBASE_SDK}/firebase-firestore.js`)
        ]);
        const app = getApps()[0] || initializeApp(config);
        const ref = fs.doc(fs.getFirestore(app), "maps", code);
        remote.fs = fs;
        if (seed) await fs.setDoc(ref, toRemote(state));
        remote.ref = ref;
        remote.unsub = fs.onSnapshot(ref, snap => {
          if (!snap.exists()) {
            setShareStatus("missing");
            return;
          }
          state = fromRemote(snap.data());
          save();
          render();
          setShareStatus("live");
        }, onRemoteError);
      } catch (e) {
        onRemoteError(e);
      }
    }

    function disconnectRoom() {
      if (remote.unsub) remote.unsub();
      remote.unsub = null;
      remote.ref = null;
    }

    function roomCode() {
      const abc = "abcdefghijkmnpqrstuvwxyz23456789";
      return Array.from(crypto.getRandomValues(new Uint8Array(20)), n => abc[n % abc.length]).join("");
    }

    function shareUrl() {
      return `${location.origin}${location.pathname}?room=${room}`;
    }

    function enterRoom(code, seed) {
      disconnectRoom();
      room = code;
      storageSet(ROOM_KEY, code);
      history.replaceState(null, "", `?room=${code}`);
      if (!seed) state = load();
      render();
      connectRoom(code, seed);
    }

    function leaveRoom() {
      disconnectRoom();
      room = null;
      storageSet(ROOM_KEY, null);
      history.replaceState(null, "", location.pathname);
      state = load();
      setShareStatus("off");
      render();
    }

    async function sendShareLink() {
      const url = shareUrl();
      const text = `${state.title || DEFAULT_TITLE} 같이 채워요! 🗺️`;
      try {
        if (navigator.share) {
          await navigator.share({ title: state.title, text, url });
          return;
        }
      } catch (e) {
        if (e.name === "AbortError") return;
      }
      try {
        await navigator.clipboard.writeText(url);
        toast("공유 링크를 복사했어요. 카톡으로 보내 주세요!");
      } catch (e) {
        prompt("이 링크를 복사해서 보내 주세요", url);
      }
    }

    const STATUS_TEXT = {
      live: "실시간으로 함께 쓰는 중",
      wait: "연결하는 중…",
      error: "연결에 문제가 있어요. 인터넷을 확인하고 새로고침해 주세요",
      missing: "이 공유 지도를 찾을 수 없어요. 링크를 다시 확인해 주세요"
    };

    function setShareStatus(status) {
      remote.status = status;
      renderShare();
    }

    function renderShare() {
      const box = document.getElementById("shareBody");
      box.innerHTML = "";
      const add = html => {
        const el = document.createElement("div");
        el.innerHTML = html;
        box.append(...el.childNodes);
      };

      if (remote.status === "nocfg") {
        add('<p class="share-note">함께 쓰려면 처음 한 번 Firebase 설정이 필요해요. <b>travel-map/README.md</b>의 “함께 쓰기 설정”을 따라 해 주세요. 설정 전에는 이 기기에만 저장돼요.</p>');
        if (room) {
          const b = document.createElement("button");
          b.className = "btn";
          b.textContent = "개인 지도로 돌아가기";
          b.onclick = leaveRoom;
          box.append(b);
        }
        return;
      }

      if (!room) {
        add('<p class="share-note">공유 지도를 만들고 링크를 보내면, 아내와 같은 지도를 함께 색칠하고 스티커를 붙일 수 있어요. 지금 기록이 공유 지도로 옮겨져요.</p>');
        const make = document.createElement("button");
        make.className = "btn primary";
        make.style.width = "100%";
        make.textContent = "🔗 함께 쓰는 지도 만들기";
        make.onclick = async () => {
          const config = await loadFirebaseConfig();
          if (!config) return setShareStatus("nocfg");
          enterRoom(roomCode(), true);
          sendShareLink();
        };
        box.append(make);

        const row = document.createElement("div");
        row.className = "join-row";
        const input = document.createElement("input");
        input.placeholder = "받은 링크나 코드로 참여";
        const join = document.createElement("button");
        join.className = "btn";
        join.textContent = "참여";
        join.onclick = () => {
          const v = input.value.trim();
          const code = (v.match(/room=([a-z0-9]+)/) || [null, v])[1];
          if (!/^[a-z0-9]{20}$/.test(code)) return alert("공유 링크나 20자리 코드를 넣어 주세요.");
          enterRoom(code, false);
        };
        row.append(input, join);
        box.append(row);
        return;
      }

      const dotClass = { live: "live", wait: "wait", error: "error", missing: "error" }[remote.status] || "";
      add(`<div class="share-status"><span class="dot ${dotClass}"></span><span>${STATUS_TEXT[remote.status] || "공유 지도"}</span></div>`);
      add(`<p class="share-note">공유 코드 <span class="share-code">${room}</span><br>링크를 받은 사람은 누구나 이 지도를 보고 고칠 수 있어요.</p>`);
      const actions = document.createElement("div");
      actions.className = "actions";
      const send = document.createElement("button");
      send.className = "btn primary";
      send.textContent = "📤 링크 보내기";
      send.onclick = sendShareLink;
      const leave = document.createElement("button");
      leave.className = "btn";
      leave.textContent = "공유 끊기";
      leave.onclick = () => {
        if (confirm("이 기기에서 공유 지도 연결을 끊을까요? (공유 지도 내용은 그대로 남아요)")) leaveRoom();
      };
      actions.append(send, leave);
      box.append(actions);
    }

    /* ===== 작은 도우미 ===== */
    const tip = document.getElementById("tip");
    const mapWrap = document.querySelector(".map-wrap");

    function regionTip(r) {
      const rec = state.regions[r.id];
      if (!rec) return r.properties.label;
      const visits = visitsOf(rec);
      return [r.properties.label, groupNames(rec), visits.length > 1 ? `${visits.length}번 다녀옴` : visits[0].date].filter(Boolean).join(" · ");
    }

    function showTip(e, text) {
      const box = mapWrap.getBoundingClientRect();
      tip.textContent = text;
      tip.style.left = `${e.clientX - box.left}px`;
      tip.style.top = `${e.clientY - box.top}px`;
      tip.style.opacity = 1;
    }

    function hideTip() {
      tip.style.opacity = 0;
    }

    let toastTimer;
    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function today() {
      const d = new Date();
      return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    buildTrays();
    syncTools();
    render();
    renderShare();
    if (room) connectRoom(room, false);
    else loadFirebaseConfig().then(config => { if (!config) setShareStatus("nocfg"); });
  </script>
</body>
</html>
