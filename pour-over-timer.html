<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>린넨베이지 드립 타이머</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen brew console. Timer + target grams stay pinned at top; schedule and settings below. */
:root {
  --bg: #eef0ec;        /* cool linen */
  --surface: #f8f9f6;
  --line: #d3d6cf;
  --fg: #2a211c;        /* espresso */
  --muted: #6d6660;
  --accent: #d9604a;    /* pomelo flesh */
  --accent-soft: #f6dcd4;
  --ok: #3f7d5a;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "Martian Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171412; --surface: #211c19; --line: #3a322d; --fg: #efe8e2; --muted: #a59b93;
    --accent: #f07c64; --accent-soft: #3d2620; --ok: #7cc49a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171412; --surface: #211c19; --line: #3a322d; --fg: #efe8e2; --muted: #a59b93;
  --accent: #f07c64; --accent-soft: #3d2620; --ok: #7cc49a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
  display: flex; flex-direction: column; gap: 18px;
}
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.15rem; font-weight: 700; text-wrap: balance; }
.meta { color: var(--muted); font-size: .8rem; letter-spacing: .02em; }
.eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* Console (sticky) */
.console {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 14px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.readouts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.readout { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.big { font-size: clamp(2.6rem, 13vw, 3.8rem); font-weight: 600; line-height: 1; letter-spacing: -.03em; }
.big small { font-size: .38em; font-weight: 400; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
#water { color: var(--accent); }
.status {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  padding-top: 12px; border-top: 1px solid var(--line);
}
.phase { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.pill {
  font-size: .72rem; font-weight: 500; padding: 3px 9px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent);
}
.pill.wait { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.pill.done { background: transparent; color: var(--ok); border: 1px solid var(--ok); }
.next { color: var(--muted); font-size: .85rem; }
.guide { font-size: .85rem; color: var(--muted); }
.guide b { color: var(--fg); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }
.controls { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
button {
  font: inherit; font-weight: 700; border-radius: 12px; padding: 14px 10px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--fg);
}
button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); font-size: 1.05rem; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Schedule */
section h2 { margin: 0 0 8px; font-size: .95rem; }
.steps { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.steps li {
  display: grid; grid-template-columns: 4.2rem 1fr auto; gap: 10px; align-items: baseline;
  padding: 10px 4px; border-bottom: 1px solid var(--line); color: var(--muted);
}
.steps li .t { font-size: .85rem; }
.steps li .w { font-size: .9rem; }
.steps li.active { color: var(--fg); background: var(--accent-soft); }
.steps li.active .w { color: var(--accent); font-weight: 600; }
.steps li.past { opacity: .55; }
.steps li .n { font-weight: 500; }
.steps li .n span { display: block; font-size: .78rem; font-weight: 400; }

/* Settings */
.settings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: .75rem; color: var(--muted); }
.field input {
  font: 500 1rem var(--font-num); width: 100%; padding: 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.notes { font-size: .85rem; color: var(--muted); margin: 0; }
.notes b { color: var(--fg); font-weight: 500; }
.toggles { display: flex; gap: 16px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

.flash { animation: flash .6s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 4px var(--accent); } to { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } .bar > i { transition: none; } }
@media (max-width: 380px) { .settings { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>포멜로빈 린넨베이지</h1>
    <span class="meta">하리오 분쇄 · 핸드드립 4회 푸어</span>
  </header>

  <div class="console" id="console">
    <div class="readouts">
      <div class="readout">
        <span class="eyebrow">경과 시간</span>
        <span class="big num" id="time">0:00</span>
      </div>
      <div class="readout">
        <span class="eyebrow">목표 누적 물양</span>
        <span class="big num" id="water">0<small>g</small></span>
      </div>
    </div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <div class="status">
      <div class="phase"><span id="phase">준비</span><span class="pill wait" id="pill">대기</span></div>
      <span class="next num" id="next">시작을 누르세요</span>
    </div>
    <div class="guide" id="guide">저울을 0으로 맞추고 시작하세요.</div>
    <div class="controls">
      <button class="primary" id="startBtn" type="button">시작</button>
      <button id="resetBtn" type="button">리셋</button>
    </div>
  </div>

  <section>
    <h2>푸어 스케줄</h2>
    <ol class="steps" id="steps"></ol>
  </section>

  <section>
    <h2>레시피</h2>
    <div class="settings">
      <div class="field"><label for="dose">원두 (g)</label><input id="dose" type="number" inputmode="decimal" min="8" max="40" step="0.5" value="20"></div>
      <div class="field"><label for="ratio">비율 1 :</label><input id="ratio" type="number" inputmode="decimal" min="10" max="20" step="0.5" value="15"></div>
      <div class="field"><label for="temp">물 온도 (°C)</label><input id="temp" type="number" inputmode="numeric" min="80" max="100" step="1" value="92"></div>
    </div>
    <p class="notes" style="margin-top:10px">총 물양 <b class="num" id="total">300 g</b> · 분쇄도 <b>중간-가늘게</b> (하리오 핸드밀 기준 굵은 설탕 정도)</p>
    <p class="notes" style="margin-top:6px">커핑 차트상 단맛·여운·바디가 높고 산미는 낮은 편이라, 92°C 전후와 1:15 비율로 단맛과 질감을 살리는 쪽에 맞췄습니다. 쓰면 온도를 1–2°C 낮추거나 조금 굵게, 밍밍하면 1:14로 진하게 조정하세요.</p>
    <div class="toggles" style="margin-top:10px">
      <label><input type="checkbox" id="sound" checked> 단계 알림음</label>
      <label><input type="checkbox" id="awake" checked> 화면 꺼짐 방지</label>
    </div>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  // Each step: start time (s), pour duration (s), cumulative target as fraction of total water
  // (bloom uses 2.2x dose instead). Last entry marks the expected finish.
  const PLAN = [
    { name: '뜸들이기', hint: '원을 그리며 가루 전체를 적시기', at: 0,   pour: 10, bloom: true },
    { name: '1차 푸어', hint: '중심에서 바깥으로 천천히',       at: 40,  pour: 20, frac: 0.40 },
    { name: '2차 푸어', hint: '같은 속도로 원 그리기',           at: 75,  pour: 20, frac: 0.70 },
    { name: '3차 푸어', hint: '중심 위주로 마무리',              at: 110, pour: 20, frac: 1.00 },
    { name: '드로우다운', hint: '물이 다 빠질 때까지 기다리기',   at: 135, pour: 0,  hold: true },
    { name: '완료', hint: '서버를 저어 맛을 고르게',            at: 180, pour: 0,  done: true },
  ];

  let elapsed = 0, startedAt = null, raf = null, lastIdx = -1, lastBeepSec = -1;
  let audio = null, wakeLock = null;

  const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const recipe = () => {
    const dose = Math.min(40, Math.max(8, parseFloat($('dose').value) || 20));
    const ratio = Math.min(20, Math.max(10, parseFloat($('ratio').value) || 15));
    return { dose, total: Math.round(dose * ratio) };
  };
  const targets = () => {
    const { dose, total } = recipe();
    let prev = 0;
    return PLAN.map(st => {
      let w = prev;
      if (st.bloom) w = Math.round(dose * 2.2);
      else if (st.frac) w = Math.max(prev, Math.round(total * st.frac));
      const from = prev; prev = w;
      return { ...st, from, to: w };
    });
  };

  function renderSteps() {
    const list = targets();
    $('total').textContent = recipe().total + ' g';
    $('steps').innerHTML = list.map((st, i) => `
      <li data-i="${i}">
        <span class="t num">${fmt(st.at)}</span>
        <span class="n">${st.name}<span>${st.hint}</span></span>
        <span class="w num">${st.hold || st.done ? '—' : st.to + ' g'}</span>
      </li>`).join('');
    lastIdx = -1;
    update();
  }

  function stepIndex(t) {
    let idx = 0;
    PLAN.forEach((st, i) => { if (t >= st.at) idx = i; });
    return idx;
  }

  function beep(freq = 880, dur = 0.15) {
    if (!$('sound').checked || !audio) return;
    try {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.25, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }

  function update() {
    const t = startedAt != null ? elapsed + (performance.now() - startedAt) / 1000 : elapsed;
    const list = targets();
    const i = stepIndex(t);
    const st = list[i];
    const nxt = list[i + 1];
    const into = t - st.at;
    const pouring = startedAt != null || elapsed > 0 ? (st.pour > 0 && into < st.pour) : false;
    const running = startedAt != null || elapsed > 0;

    $('time').textContent = fmt(t);
    $('water').innerHTML = (running ? st.to : list[0].to) + '<small>g</small>';
    $('bar').style.width = Math.min(100, t / PLAN[PLAN.length - 1].at * 100) + '%';

    const pill = $('pill');
    if (!running) {
      $('phase').textContent = '준비';
      pill.textContent = '대기'; pill.className = 'pill wait';
      $('next').textContent = '첫 목표 ' + list[0].to + ' g';
      $('guide').textContent = '저울을 0으로 맞추고, 물을 붓기 시작할 때 시작을 누르세요.';
    } else if (st.done) {
      $('phase').textContent = '추출 완료';
      pill.textContent = '완료'; pill.className = 'pill done';
      $('next').textContent = '총 ' + recipe().total + ' g';
      $('guide').textContent = '드리퍼를 내리고 서버를 한 번 저어주세요.';
    } else {
      $('phase').textContent = st.name;
      if (pouring) {
        const live = Math.round(st.from + (st.to - st.from) * Math.min(1, into / st.pour));
        pill.textContent = '붓는 중'; pill.className = 'pill';
        $('guide').innerHTML = `지금 저울 가이드 <b class="num">${live} g</b> → ${st.to} g까지 (${Math.ceil(st.pour - into)}초)`;
      } else {
        pill.textContent = st.hold ? '대기' : '기다리기'; pill.className = 'pill wait';
        $('guide').textContent = st.hint;
      }
      if (nxt) $('next').textContent = `${nxt.name} ${nxt.done ? '' : nxt.hold ? '' : nxt.to + ' g '}· ${fmt(nxt.at - t)} 후`;
    }

    if (running && startedAt != null && nxt) {
      const left = Math.ceil(nxt.at - t);
      if (left <= 3 && left >= 1 && left !== lastBeepSec) { lastBeepSec = left; beep(660, 0.08); }
    }
    if (i !== lastIdx) {
      if (lastIdx !== -1 && startedAt != null) {
        beep(st.done ? 520 : 990, st.done ? 0.5 : 0.2);
        const c = $('console'); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
      }
      lastIdx = i;
      document.querySelectorAll('#steps li').forEach(li => {
        const k = +li.dataset.i;
        li.className = running && k === i ? 'active' : running && k < i ? 'past' : '';
      });
    }
    if (startedAt != null) raf = requestAnimationFrame(update);
  }

  async function keepAwake(on) {
    try {
      if (on && $('awake').checked && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch (e) { wakeLock = null; }
  }

  function toggle() {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (audio && audio.state === 'suspended') audio.resume();
    if (startedAt == null) {
      startedAt = performance.now();
      $('startBtn').textContent = '일시정지';
      keepAwake(true);
      lastIdx = -1;
      update();
    } else {
      elapsed += (performance.now() - startedAt) / 1000;
      startedAt = null;
      cancelAnimationFrame(raf);
      $('startBtn').textContent = '계속';
      keepAwake(false);
      update();
    }
  }

  function reset() {
    cancelAnimationFrame(raf);
    startedAt = null; elapsed = 0; lastIdx = -1; lastBeepSec = -1;
    $('startBtn').textContent = '시작';
    keepAwake(false);
    update();
  }

  $('startBtn').addEventListener('click', toggle);
  $('resetBtn').addEventListener('click', reset);
  ['dose', 'ratio'].forEach(id => $(id).addEventListener('input', renderSteps));
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.key === 'r' || e.key === 'R') reset();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && startedAt != null) keepAwake(true);
  });

  renderSteps();
})();
</script>
</body>
</html>
