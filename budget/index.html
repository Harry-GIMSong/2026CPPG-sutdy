<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f4f7f1" />
  <meta name="apple-mobile-web-app-title" content="가계부" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>우리집 가계부</title>
  <meta name="description" content="부부가 함께 적고 같이 보는 실시간 공유 가족 가계부" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="우리집 가계부" />
  <meta property="og:description" content="같이 적고 같이 보는 우리집 가계부 💰" />
  <meta property="og:image" content="https://harry-gimsong.github.io/PR/budget/icon-512.png" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7f1;
      --card: #ffffff;
      --text: #24311f;
      --sub: #74806c;
      --line: #e4eadd;
      --soft: #eef3e8;
      --primary: #16a34a;
      --primary-dark: #15803d;
      --out: #e5484d;
      --in: #2f7fe0;
      --cardc: #7c3aed;
      --danger: #ef4444;
      --shadow: 0 8px 24px rgba(40, 70, 30, 0.08);
      --radius: 18px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #141813;
        --card: #1d231b;
        --text: #e7eee2;
        --sub: #9aa792;
        --line: #2c3529;
        --soft: #252d22;
        --primary: #22c55e;
        --primary-dark: #16a34a;
        --out: #ff6b6f;
        --in: #5aa2ff;
        --cardc: #b794ff;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      padding-bottom: calc(84px + env(safe-area-inset-bottom));
    }

    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
    input, select { font: inherit; color: inherit; }
    [hidden] { display: none !important; }

    .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

    /* 상단 */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: max(14px, env(safe-area-inset-top));
      padding-bottom: 6px;
    }

    .title { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; text-align: left; }

    .sync {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--sub);
      background: var(--card);
      border-radius: 999px;
      padding: 6px 11px;
      box-shadow: var(--shadow);
      white-space: nowrap;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: #b8c2b0; flex: none; }
    .dot.live { background: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2); }
    .dot.wait { background: #eab308; }
    .dot.error { background: var(--danger); }

    .month-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 4px 0 12px;
    }

    .month-nav button { width: 40px; height: 40px; border-radius: 50%; font-size: 1.4rem; color: var(--sub); }
    .month-nav button:active { background: var(--soft); }
    .month-nav #monthLabel { width: auto; padding: 0 12px; border-radius: 12px; font-size: 1.1rem; font-weight: 700; color: var(--text); }

    /* 카드 */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 14px;
    }

    .card h3 {
      margin: 0 0 12px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card h3 small { font-weight: 500; color: var(--sub); font-size: 0.8rem; }
    .link { color: var(--primary); font-weight: 600; font-size: 0.85rem; }

    .hero-label { color: var(--sub); font-size: 0.9rem; }
    .hero-amt { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; margin: 2px 0 14px; }
    .hero-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hero-row > div { background: var(--soft); border-radius: 14px; padding: 10px 12px; }
    .hero-row span { display: block; font-size: 0.78rem; color: var(--sub); }
    .hero-row b { font-size: 1.05rem; }

    .inc { color: var(--in); }
    .neg { color: var(--out); }

    .budget { margin-top: 14px; }
    .budget-top { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; gap: 8px; }
    .budget-top span { color: var(--sub); }
    .budget-tip { font-size: 0.82rem; color: var(--sub); margin-top: 6px; }

    .bar { height: 8px; background: var(--soft); border-radius: 999px; overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 999px; background: var(--primary); transition: width 0.3s; }
    .bar i.over { background: var(--out); }

    .stack { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--soft); margin-bottom: 14px; }
    .stack i { display: block; height: 100%; }

    .cat-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 0; }
    .cat-row + .cat-row { border-top: 1px solid var(--line); }
    .emo {
      width: 38px; height: 38px; flex: none;
      display: grid; place-items: center;
      background: var(--soft); border-radius: 12px; font-size: 1.2rem;
    }
    .cat-main { flex: 1; min-width: 0; }
    .cat-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 5px; font-size: 0.93rem; }
    .cat-sub { font-size: 0.75rem; color: var(--sub); margin-top: 4px; }

    .banner {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      background: #fff7d6; color: #5c4a00; border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; font-size: 0.9rem;
    }
    @media (prefers-color-scheme: dark) { .banner { background: #3a3315; color: #f3e6a8; } }
    .banner p { margin: 0; flex: 1 1 200px; }

    /* 거래 */
    .tx { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 0; }
    .tx + .tx { border-top: 1px solid var(--line); }
    .tx-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .tx-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-sub { font-size: 0.78rem; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx b { white-space: nowrap; }

    .day-head { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--sub); padding: 14px 2px 4px; }
    .day-head:first-child { padding-top: 0; }

    .empty { text-align: center; color: var(--sub); padding: 26px 10px; font-size: 0.92rem; line-height: 1.6; }

    /* 달력 */
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal .wd { text-align: center; font-size: 0.72rem; color: var(--sub); padding-bottom: 4px; }
    .cal .wd:first-child { color: var(--out); }
    .day {
      min-height: 52px; border-radius: 10px; padding: 4px 2px;
      display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 0.68rem;
    }
    .day .dn { font-size: 0.8rem; font-weight: 600; }
    .day.sun .dn { color: var(--out); }
    .day.today .dn { background: var(--primary); color: #fff; border-radius: 999px; padding: 0 6px; }
    .day.sel { background: var(--soft); outline: 2px solid var(--primary); }
    .day .do { color: var(--out); }
    .day .di { color: var(--in); }
    .day .dc { color: var(--cardc); font-weight: 600; }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .filters select, .filters input {
      border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 10px; font-size: 0.88rem; min-width: 0;
    }
    .filters input { flex: 1 1 140px; }
    .filters select { flex: 1 1 100px; }
    .list-sum { font-size: 0.82rem; color: var(--sub); margin-bottom: 8px; }

    .seg { display: inline-flex; background: var(--soft); border-radius: 12px; padding: 3px; }
    .seg button { padding: 7px 14px; border-radius: 10px; font-size: 0.88rem; color: var(--sub); }
    .seg button.on { background: var(--card); color: var(--text); font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .seg.big { display: flex; }
    .seg.big button { flex: 1; padding: 10px; }
    .seg.big button.on[data-v="out"] { color: var(--out); }
    .seg.big button.on[data-v="in"] { color: var(--in); }

    /* 통계 */
    .chart { display: flex; align-items: flex-end; gap: 6px; height: 170px; }
    .col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; gap: 3px; border-radius: 10px; padding-top: 4px; }
    .col.cur { background: var(--soft); }
    .bars { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 3px; }
    .bars i { width: 34%; max-width: 18px; border-radius: 5px 5px 2px 2px; min-height: 2px; }
    .b-in { background: var(--in); opacity: 0.85; }
    .b-out { background: var(--out); opacity: 0.85; }
    .cl { font-size: 0.75rem; color: var(--sub); }
    .cv { font-size: 0.68rem; color: var(--out); }
    .legend { display: flex; gap: 14px; font-size: 0.78rem; color: var(--sub); margin-top: 10px; justify-content: center; }
    .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; background: var(--c); }

    .stats-seg { margin-bottom: 14px; }
    .chart-box { position: relative; height: 220px; }
    .chart-box.tall { height: 250px; }
    .donut-wrap { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .donut { position: relative; height: 170px; }
    @media (min-width: 560px) { .donut-wrap { grid-template-columns: 180px 1fr; align-items: center; } }
    .dl-row { display: grid; grid-template-columns: 10px 1fr auto; column-gap: 8px; align-items: center; width: 100%; text-align: left; padding: 5px 0; font-size: 0.88rem; }
    .dl-row i { width: 10px; height: 10px; border-radius: 3px; }
    .dl-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dl-row small { grid-column: 2 / 4; color: var(--sub); font-size: 0.72rem; }
    .cmp-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; }
    .cmp-row + .cmp-row { border-top: 1px solid var(--line); }
    .cmp-row > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cmp-r { text-align: right; display: flex; flex-direction: column; white-space: nowrap; }
    .cmp-r small { font-size: 0.74rem; color: var(--sub); }
    .mtable { font-size: 0.86rem; }
    .mt-row { display: grid; grid-template-columns: 0.7fr 1fr 1fr 1fr; gap: 6px; width: 100%; padding: 8px 6px; text-align: right; border-radius: 8px; }
    .mt-row span:first-child { text-align: left; font-weight: 600; }
    .mt-row + .mt-row { border-top: 1px solid var(--line); }
    .mt-row.cur { background: var(--soft); }
    .mt-head { color: var(--sub); font-size: 0.76rem; }
    .mt-total { font-weight: 700; border-top: 2px solid var(--line) !important; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { background: var(--soft); border-radius: 14px; padding: 12px; }
    .stat span { display: block; font-size: 0.78rem; color: var(--sub); }
    .stat b { font-size: 1.05rem; }

    .diff-up { color: var(--out); font-size: 0.78rem; }
    .diff-down { color: var(--primary); font-size: 0.78rem; }

    /* 설정 */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 8px 12px; border-radius: 999px; background: var(--soft); font-size: 0.9rem; border: 2px solid transparent;
    }
    .chip.on { border-color: var(--primary); background: var(--card); font-weight: 700; }
    .chip small { color: var(--sub); font-size: 0.75rem; }
    .chip.add { color: var(--primary); font-weight: 600; }

    .set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; width: 100%; text-align: left; }
    .set-row + .set-row { border-top: 1px solid var(--line); }
    .set-row span { color: var(--sub); font-size: 0.88rem; }
    .note { font-size: 0.82rem; color: var(--sub); line-height: 1.6; margin: 0 0 10px; }
    .sub-h { font-size: 0.82rem; color: var(--sub); margin: 14px 0 8px; font-weight: 600; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 16px; border-radius: 12px; background: var(--soft); font-weight: 600; font-size: 0.92rem;
    }
    .btn.primary { background: var(--primary); color: #fff; }
    .btn.primary:active { background: var(--primary-dark); }
    .btn.danger { color: var(--danger); }
    .btn.small { padding: 7px 12px; font-size: 0.85rem; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1 1 140px; }

    .share-status { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 8px; }
    .share-code { font-family: ui-monospace, Menlo, monospace; background: var(--soft); padding: 2px 6px; border-radius: 6px; font-size: 0.8rem; word-break: break-all; }
    .join-row { display: flex; gap: 8px; margin-top: 10px; }
    .join-row input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); }

    /* 카드 */
    .bill-total { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .bill-total b { font-size: 1.6rem; letter-spacing: -0.02em; }
    .bill-head { display: flex; align-items: center; gap: 12px; }
    .bill-head .cat-main { min-width: 0; }
    .bill-head b { font-size: 1.15rem; white-space: nowrap; }
    .bill-meta { font-size: 0.78rem; color: var(--sub); }
    .who-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .who-chips span { background: var(--soft); border-radius: 999px; padding: 4px 10px; font-size: 0.8rem; }
    details.bill-list { margin-top: 10px; }
    details.bill-list summary { cursor: pointer; color: var(--primary); font-weight: 600; font-size: 0.85rem; list-style: none; }
    details.bill-list summary::-webkit-details-marker { display: none; }
    .bill-hint { margin-top: 8px; font-size: 0.82rem; color: var(--cardc); font-weight: 600; }
    .inline-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
    .inline-row select { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 10px; }
    .pay-note { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 0.82rem; line-height: 1.6; margin-top: 12px; }
    .cardpay { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 8px; border-radius: 12px; background: var(--soft); color: var(--cardc); font-weight: 600; font-size: 0.88rem; }

    .new-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--out); margin-right: 6px; vertical-align: middle; }
    .alerts { padding: 8px 14px; }
    .alert-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    .alert-row + .alert-row { border-top: 1px solid var(--line); }
    .alert-icon { font-size: 1.1rem; }
    .alert-text { flex: 1; text-align: left; font-size: 0.9rem; }
    .alert-x { color: var(--sub); width: 28px; height: 28px; border-radius: 50%; }

    /* 아래 탭 */
    .tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      display: flex; justify-content: center;
      background: var(--card); border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tabs button { flex: 1; max-width: 160px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 0 8px; font-size: 1.2rem; opacity: 0.55; }
    .tabs button span { font-size: 0.72rem; font-weight: 600; }
    .tabs button.on { opacity: 1; }
    .tabs button.on span { color: var(--primary); }

    .fab {
      position: fixed; z-index: 21;
      right: max(18px, calc(50% - 302px));
      bottom: calc(76px + env(safe-area-inset-bottom));
      width: 58px; height: 58px; border-radius: 50%;
      background: var(--primary); color: #fff; font-size: 2rem; line-height: 1;
      box-shadow: 0 10px 24px rgba(22, 163, 74, 0.4);
    }
    .fab:active { transform: scale(0.95); }

    /* 시트 */
    .sheet-bg {
      position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, 0.35);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .sheet {
      width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto;
      background: var(--card); border-radius: 22px 22px 0 0;
      padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
      animation: up 0.2s ease-out;
    }
    @keyframes up { from { transform: translateY(40px); opacity: 0.5; } }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .sheet-head h2 { margin: 0; font-size: 1.1rem; }
    .x { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); }
    .lbl { display: block; font-size: 0.82rem; color: var(--sub); margin: 16px 0 8px; font-weight: 600; }
    .field {
      width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 12px;
    }
    .amt-wrap { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--line); margin-top: 16px; padding-bottom: 4px; }
    .amt-wrap:focus-within { border-color: var(--primary); }
    .amt-wrap input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
    .amt-wrap span { font-size: 1.2rem; color: var(--sub); }
    .quick { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .quick button { padding: 6px 10px; border-radius: 999px; background: var(--soft); font-size: 0.82rem; }
    .sheet-actions { display: flex; gap: 8px; margin-top: 20px; }
    .sheet-actions .btn { flex: 1; padding: 13px; }
    .sheet-actions .btn.danger { flex: 0 0 auto; }
    .emoji-pick { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .emoji-pick button { width: 38px; height: 38px; border-radius: 10px; font-size: 1.2rem; }
    .emoji-pick button.on { background: var(--soft); outline: 2px solid var(--primary); }

    .toast {
      position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); z-index: 60;
      transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
      background: #24311f; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 0.88rem;
      transition: 0.25s; max-width: calc(100% - 32px); text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <button id="title" class="title" title="눌러서 이름 바꾸기">우리집 가계부</button>
      <button id="syncBadge" class="sync"><span class="dot" id="syncDot"></span><span id="syncText">이 기기에 저장</span></button>
    </header>
    <div class="month-nav" id="monthNav">
      <button id="prevM" aria-label="이전 달">‹</button>
      <button id="monthLabel" title="이번 달로"></button>
      <button id="nextM" aria-label="다음 달">›</button>
    </div>
    <main>
      <section id="view-home"></section>
      <section id="view-list" hidden></section>
      <section id="view-cards" hidden></section>
      <section id="view-stats" hidden></section>
      <section id="view-settings" hidden></section>
    </main>
  </div>

  <button id="fab" class="fab" aria-label="기록하기">＋</button>
  <nav class="tabs">
    <button data-tab="home" class="on">🏠<span>홈</span></button>
    <button data-tab="list">📋<span>내역</span></button>
    <button data-tab="cards">💳<span>카드</span></button>
    <button data-tab="stats">📊<span>통계</span></button>
    <button data-tab="settings">⚙️<span>설정</span></button>
  </nav>

  <div id="sheetBg" class="sheet-bg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast"></div>
  <input type="file" id="fileIn" accept="application/json,.json" hidden />

  <script type="module">
    /* ===== 기본 설정 ===== */
    const STORE_KEY = "familyBudget.v1";
    const ROOM_KEY = "familyBudget.room";
    const ME_KEY = "familyBudget.me";
    const PAY_KEY = "familyBudget.lastPay";
    const DISMISS_KEY = "familyBudget.dismissed";
    const DEFAULT_TITLE = "우리집 가계부";
    const COLORS = ["#22c55e", "#f97316", "#3b82f6", "#eab308", "#ec4899", "#8b5cf6", "#14b8a6", "#ef4444", "#64748b", "#84cc16", "#06b6d4", "#f43f5e", "#a16207"];
    const EMOJIS = ["🍚", "🛒", "☕", "🍕", "🍺", "🧴", "🏠", "💡", "📱", "🚗", "⛽", "🚌", "👶", "🧸", "📚", "💊", "🏥", "🛡️", "👕", "💇", "🎡", "✈️", "🎬", "🎁", "💝", "🐶", "🐱", "🏋️", "💳", "🟦", "🟥", "🟩", "🟨", "⬛", "🏦", "📦", "💰", "💵", "🎉", "➕", "🧔", "👩", "👨‍👩‍👧", "👦", "👧", "👵", "👴"];

    const cat = (id, name, emoji, type) => ({ id, name, emoji, type, budget: 0 });
    function emptySettings() {
      return {
        title: DEFAULT_TITLE,
        members: [
          { id: "hus", name: "남편", emoji: "🧔" },
          { id: "wife", name: "아내", emoji: "👩" },
          { id: "fam", name: "공동", emoji: "👨‍👩‍👧" }
        ],
        cats: [
          cat("food", "장보기·식비", "🛒", "out"),
          cat("eatout", "외식·배달", "🍕", "out"),
          cat("cafe", "카페·간식", "☕", "out"),
          cat("living", "생활용품", "🧴", "out"),
          cat("house", "주거·관리비", "🏠", "out"),
          cat("phone", "통신·구독", "📱", "out"),
          cat("car", "교통·차량", "🚗", "out"),
          cat("kid", "육아·교육", "👶", "out"),
          cat("pet", "반려동물", "🐱", "out"),
          cat("health", "병원·약", "💊", "out"),
          cat("insure", "보험", "🛡️", "out"),
          cat("shop", "쇼핑·미용", "👕", "out"),
          cat("fun", "여가·여행", "🎡", "out"),
          cat("gift", "경조사·선물", "🎁", "out"),
          cat("saving", "저축·투자", "🏦", "out"),
          cat("etc", "기타", "📦", "out"),
          cat("salary", "월급", "💰", "in"),
          cat("side", "부수입", "💵", "in"),
          cat("bonus", "환급·용돈", "🎉", "in"),
          cat("inetc", "기타수입", "➕", "in")
        ],
        payments: [{ id: "cash", name: "현금·이체", emoji: "💵", kind: "cash", owner: "" }],
        basis: "bill",
        monthBudget: 0,
        fixed: [],
        favs: [],
        fixedDone: {},
        catsVersion: CATS_VERSION
      };
    }

    // 나중에 기본 분류에 더한 것들. 예전에 만든 가계부에도 한 번만 넣어 줍니다 (비슷한 이름이 이미 있으면 건너뜀)
    const CATS_VERSION = 2;
    const NEW_CATS = [
      { c: cat("pet", "반려동물", "🐱", "out"), like: ["반려", "고양이", "냥"], after: "kid" },
      { c: cat("insure", "보험", "🛡️", "out"), like: ["보험"], after: "health" },
      { c: cat("saving", "저축·투자", "🏦", "out"), like: ["저축"] }
    ];

    function withNewCats(cats) {
      cats = cats.slice();
      for (const { c, like, after } of NEW_CATS) {
        if (cats.some(x => x.id === c.id || (x.type === c.type && like.some(w => x.name.includes(w))))) continue;
        const prev = cats.findIndex(x => x.id === after);
        const etc = cats.findIndex(x => x.id === "etc");
        cats.splice(prev >= 0 ? prev + 1 : etc >= 0 ? etc : cats.filter(x => x.type === "out").length, 0, { ...c });
      }
      return cats;
    }

    function normSettings(d) {
      const e = emptySettings();
      d = d || {};
      return {
        title: d.title || e.title,
        members: Array.isArray(d.members) && d.members.length ? d.members : e.members,
        cats: Array.isArray(d.cats) && d.cats.some(c => c.type === "out") && d.cats.some(c => c.type === "in")
          ? ((Number(d.catsVersion) || 1) < CATS_VERSION ? withNewCats(d.cats) : d.cats)
          : e.cats,
        payments: Array.isArray(d.payments) && d.payments.length ? d.payments : e.payments,
        basis: d.basis === "use" ? "use" : "bill",
        monthBudget: Number(d.monthBudget) || 0,
        fixed: Array.isArray(d.fixed) ? d.fixed : [],
        favs: Array.isArray(d.favs) ? d.favs : [],
        fixedDone: d.fixedDone && typeof d.fixedDone === "object" ? d.fixedDone : {},
        catsVersion: CATS_VERSION
      };
    }

    function emptyState() {
      return { settings: emptySettings(), months: {} };
    }

    function isValidState(s) {
      return s && typeof s === "object" && s.settings && s.months && typeof s.months === "object";
    }

    /* ===== 저장 ===== */
    function storageGet(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }

    function storageSet(key, value) {
      try {
        if (value == null) localStorage.removeItem(key);
        else localStorage.setItem(key, value);
      } catch (e) { /* 무시 */ }
    }

    // 공유 가계부는 방마다 따로 이 기기에 캐시하고, 개인 가계부는 그대로 둡니다
    let room = new URLSearchParams(location.search).get("room") || storageGet(ROOM_KEY);
    if (room && !/^[a-z0-9]{20}$/.test(room)) room = null;
    if (room) storageSet(ROOM_KEY, room);

    function cacheKey() {
      return room ? `${STORE_KEY}:room:${room}` : STORE_KEY;
    }

    function load() {
      try {
        const s = JSON.parse(storageGet(cacheKey()));
        if (isValidState(s)) return { settings: normSettings(s.settings), months: s.months };
      } catch (e) { /* 저장소를 못 쓰는 환경이면 새로 시작 */ }
      return emptyState();
    }

    function save() {
      storageSet(cacheKey(), JSON.stringify(state));
    }

    let state = load();
    let tab = "home";
    let statsMode = "month";
    let cur = mkey(today());
    const filter = { type: "all", who: "", cat: "", pay: "", tag: "", q: "", day: 0 };

    /* ===== 작은 도우미 ===== */
    const $ = id => document.getElementById(id);
    const pad = n => String(n).padStart(2, "0");

    function today() {
      const d = new Date();
      return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }

    function mkey(date) { return date.slice(0, 7); }
    function fkey(month) { return "m" + month.replace("-", ""); }

    function shiftMonth(k, n) {
      const [y, m] = k.split("-").map(Number);
      const d = new Date(y, m - 1 + n, 1);
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    }

    function daysIn(k) {
      const [y, m] = k.split("-").map(Number);
      return new Date(y, m, 0).getDate();
    }

    function monthName(k) {
      const [y, m] = k.split("-").map(Number);
      return y === new Date().getFullYear() ? `${m}월` : `${y}년 ${m}월`;
    }

    function dayLabel(date) {
      const [y, m, d] = date.split("-").map(Number);
      const wd = "일월화수목금토"[new Date(y, m - 1, d).getDay()];
      return `${m}월 ${d}일 (${wd})`;
    }

    function won(n) { return Math.round(n).toLocaleString("ko-KR") + "원"; }

    function shortWon(n) {
      const a = Math.abs(n);
      if (a >= 1e8) return (Math.round(n / 1e7) / 10) + "억";
      if (a >= 1e4) return (Math.round(n / 1e3) / 10) + "만";
      return Math.round(n).toLocaleString("ko-KR");
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function digits(v) { return Number(String(v).replace(/[^0-9]/g, "")) || 0; }

    function txOf(k) { return Object.values(state.months[k] || {}); }
    function allTx() { return Object.values(state.months).flatMap(m => Object.values(m)); }

    /* ===== 카드 결제일 계산 =====
       신용카드는 매달 마감일(cutDay, 31=말일)까지 쓴 금액이 그다음에 오는 결제일(payDay)에 한꺼번에 나갑니다.
       예) 결제일 14일·말일 마감 → 10월에 쓴 돈은 11월 14일, 결제일 25일·11일 마감 → 9/12~10/11 쓴 돈은 10월 25일. */
    const PAY_KINDS = { credit: "신용카드", check: "체크카드", cash: "현금·이체" };

    function payOf(id) {
      return (id && state.settings.payments.find(p => p.id === id)) || null;
    }

    function creditCards() {
      return state.settings.payments.filter(p => p.kind === "credit");
    }

    function nextMonthOf(y, m) { return m === 12 ? [y + 1, 1] : [y, m + 1]; }
    function dayIn(k, d) { return Math.min(d, daysIn(k)); }

    function billDate(p, date) {
      let [y, m, d] = date.split("-").map(Number);
      if (d > dayIn(`${y}-${pad(m)}`, p.cutDay)) [y, m] = nextMonthOf(y, m);
      let k = `${y}-${pad(m)}`;
      if (dayIn(k, p.payDay) <= dayIn(k, p.cutDay)) k = shiftMonth(k, 1);
      return `${k}-${pad(dayIn(k, p.payDay))}`;
    }

    // payMonth 에 결제되는 사용 기간 [시작, 끝]
    function usePeriod(p, payMonth) {
      const endK = dayIn(payMonth, p.payDay) > dayIn(payMonth, p.cutDay) ? payMonth : shiftMonth(payMonth, -1);
      const startK = shiftMonth(endK, -1);
      const prevCut = dayIn(startK, p.cutDay);
      const start = prevCut === daysIn(startK) ? `${endK}-01` : `${startK}-${pad(prevCut + 1)}`;
      return [start, `${endK}-${pad(dayIn(endK, p.cutDay))}`];
    }

    function suggestCut(payDay) {
      const x = payDay - 14;
      return x === 0 ? 31 : x > 0 ? x : 30 + x;
    }

    // 신용카드 지출을 결제일(할부면 회차마다)로 옮긴 항목들. 다른 기록은 그대로 하나.
    function entriesOf(t) {
      const p = t.type !== "in" ? payOf(t.pay) : null;
      if (!p || p.kind !== "credit") return [t];
      const n = Math.max(1, t.inst || 1);
      const first = billDate(p, t.date);
      const base = Math.floor(t.amount / n);
      return Array.from({ length: n }, (_, i) => {
        const k = shiftMonth(mkey(first), i);
        return { ...t, amount: i ? base : t.amount - base * (n - 1), date: `${k}-${pad(dayIn(k, p.payDay))}`, useDate: t.date, instNo: n > 1 ? i + 1 : 0, billed: true };
      });
    }

    /* ===== 새로 적힌 기록 =====
       상대가 이 휴대폰에서 마지막으로 확인한 뒤에 적거나 고친 기록을 표시합니다. */
    const seenKey = () => `familyBudget.seen:${room || "local"}`;
    function seenAt() {
      let v = Number(storageGet(seenKey()));
      if (!v) {
        v = Date.now();
        storageSet(seenKey(), String(v));
      }
      return v;
    }
    let unseenCache = null;
    function unseenList() {
      if (unseenCache) return unseenCache;
      const my = me();
      const since = seenAt();
      unseenCache = allTx().filter(t => {
        const who = t.upd ? t.updBy : t.by;
        return (t.upd || t.at || 0) > since && who && who !== my;
      }).sort((a, b) => (b.upd || b.at) - (a.upd || a.at));
      unseenCache.ids = new Set(unseenCache.map(t => t.id));
      return unseenCache;
    }
    function unseenIds() { return unseenList().ids; }

    /* 카드 실적: 카드마다 정한 실적 기간(매달 perfDay일 ~ 다음 달 perfDay-1일, 1이면 1일~말일)에 쓴 금액 */
    function addDays(date, n) {
      const [y, m, d] = date.split("-").map(Number);
      return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
    }

    function perfPeriod(p, ref) {
      const day = p.perfDay || 1;
      const k = mkey(ref);
      const startK = Number(ref.slice(8)) >= dayIn(k, day) ? k : shiftMonth(k, -1);
      const nextK = shiftMonth(startK, 1);
      return [`${startK}-${pad(dayIn(startK, day))}`, addDays(`${nextK}-${pad(dayIn(nextK, day))}`, -1)];
    }

    function perfOf(p, [from, to]) {
      return allTx().filter(t => t.type !== "in" && t.pay === p.id && t.date >= from && t.date <= to).reduce((a, t) => a + val(t), 0);
    }

    function md(date) { return `${Number(date.slice(5, 7))}/${Number(date.slice(8))}`; }

    // 결제 이용기간과 같은 실적 기간 (마감일 다음 날부터)
    function perfDayFromCut(cutDay) { return cutDay >= 28 ? 1 : cutDay + 1; }

    function perfBox(p) {
      const ref = cur === mkey(today()) ? today() : `${cur}-${pad(daysIn(cur))}`;
      const period = perfPeriod(p, ref);
      const prev = perfPeriod(p, addDays(period[0], -1));
      const u = perfOf(p, period);
      const pu = perfOf(p, prev);
      return `<div class="budget" style="margin-top:12px">
        <div class="budget-top"><span>🎯 실적 ${md(period[0])}~${md(period[1])} · ${won(u)} / ${won(p.perf)}</span><b>${u >= p.perf ? "달성 ✓" : `${won(p.perf - u)} 남음`}</b></div>
        <div class="bar"><i style="width:${Math.min(100, (u / p.perf) * 100)}%;background:var(--cardc)"></i></div>
        <div class="budget-tip">지난 실적 기간 ${md(prev[0])}~${md(prev[1])} · ${won(pu)} · ${pu >= p.perf ? "✓ 달성" : "✗ 미달"}</div>
      </div>`;
    }

    /* ===== 앱 안 알림 ===== */
    function dismissed() {
      try { return JSON.parse(storageGet(DISMISS_KEY)) || {}; } catch (e) { return {}; }
    }

    function alerts() {
      const s = state.settings;
      const now = today();
      const k = mkey(now);
      const out = [];
      for (const p of s.payments) {
        if (!p.perf) continue;
        const period = perfPeriod(p, now);
        const daysLeft = Math.round((new Date(period[1]) - new Date(now)) / 864e5);
        const u = perfOf(p, period);
        if (daysLeft <= 7 && u < p.perf) out.push({ key: `perf:${p.id}:${period[0]}`, icon: "🎯", text: `${p.name} 실적까지 ${won(p.perf - u)} 남았어요 (${md(period[1])}까지 ${daysLeft}일)`, go: "cards" });
      }
      const spent = sums(spendOf(k)).out;
      if (s.monthBudget) {
        const r = spent / s.monthBudget;
        if (r >= 1) out.push({ key: `bud:${k}:over`, icon: "🚨", text: `이번 달 예산을 ${won(spent - s.monthBudget)} 넘었어요` });
        else if (r >= 0.8) out.push({ key: `bud:${k}:80`, icon: "⚠️", text: `이번 달 예산의 ${Math.floor(r * 100)}%를 썼어요 (${won(s.monthBudget - spent)} 남음)` });
      }
      const byCat = Object.fromEntries(catTotals(spendOf(k)));
      for (const c of s.cats) {
        if (c.budget && (byCat[c.id] || 0) > c.budget) out.push({ key: `cat:${c.id}:${k}`, icon: "⚠️", text: `${c.emoji} ${c.name} 예산을 ${won(byCat[c.id] - c.budget)} 넘었어요`, gocat: c.id });
      }
      const dis = dismissed();
      return out.filter(a => !dis[a.key]);
    }

    let billCache = null;
    function billIndex() {
      if (billCache) return billCache;
      billCache = {};
      for (const t of allTx()) for (const e of entriesOf(t)) (billCache[mkey(e.date)] ||= []).push(e);
      return billCache;
    }

    // 홈·통계에서 그 달 지출로 셀 기록 (설정의 집계 기준에 따라)
    function spendOf(k) {
      return state.settings.basis === "bill" ? (billIndex()[k] || []) : txOf(k);
    }

    function cardBills(k) {
      return (billIndex()[k] || []).filter(e => e.billed);
    }

    // 환불·취소는 지출을 줄이는 쪽으로 셉니다
    function val(t) { return t.refund ? -t.amount : t.amount; }

    function sums(list) {
      let out = 0, inc = 0;
      for (const t of list) t.type === "in" ? (inc += val(t)) : (out += val(t));
      return { out, inc };
    }

    function catOf(id) {
      return state.settings.cats.find(c => c.id === id) || { id, name: "삭제된 분류", emoji: "❓", type: "out", budget: 0 };
    }

    function catColor(id) {
      const i = state.settings.cats.filter(c => c.type === "out").findIndex(c => c.id === id);
      return i < 0 ? "#94a3b8" : COLORS[i % COLORS.length];
    }

    function memberOf(id) {
      return state.settings.members.find(m => m.id === id) || { id, name: "누군가", emoji: "🙂" };
    }

    function me() {
      const id = storageGet(ME_KEY);
      return state.settings.members.some(m => m.id === id) ? id : null;
    }

    function byNewest(a, b) {
      return b.date.localeCompare(a.date) || (b.at || 0) - (a.at || 0);
    }

    let toastTimer;
    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function download(blob, name) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    /* ===== 기록 바꾸기 =====
       화면을 먼저 바꾸고, 함께 쓰는 중이면 Firestore 에도 바뀐 칸만 씁니다. */
    function writeTxs(puts = [], dels = []) {
      for (const d of dels) {
        const mm = state.months[d.month];
        if (!mm) continue;
        delete mm[d.id];
        if (!Object.keys(mm).length) delete state.months[d.month];
      }
      for (const t of puts) (state.months[mkey(t.date)] ||= {})[t.id] = t;
      save();
      render();
      if (!remote.ready) return;
      const { fs } = remote;
      const b = fs.writeBatch(remote.db);
      for (const d of dels) b.set(monthRef(d.month), { tx: { [d.id]: fs.deleteField() } }, { merge: true });
      for (const t of puts) b.set(monthRef(mkey(t.date)), { tx: { [t.id]: t } }, { merge: true });
      b.commit().catch(onRemoteError);
    }

    function saveSettings(patch) {
      Object.assign(state.settings, patch);
      save();
      render();
      if (remote.ready) remote.fs.setDoc(remote.settingsRef, patch, { merge: true }).catch(onRemoteError);
    }

    function markFixedDone(month) {
      state.settings.fixedDone[fkey(month)] = true;
      save();
      render();
      if (remote.ready) remote.fs.setDoc(remote.settingsRef, { fixedDone: { [fkey(month)]: true } }, { merge: true }).catch(onRemoteError);
    }

    function replaceAll(next) {
      const oldMonths = Object.keys(state.months);
      state = next;
      save();
      render();
      if (remote.ready) pushAll(oldMonths).catch(onRemoteError);
    }

    // 지금 기록 전체를 공유 가계부에 올립니다 (oldMonths 중 없어진 달은 지움)
    async function pushAll(oldMonths = []) {
      const { fs } = remote;
      const b = fs.writeBatch(remote.db);
      b.set(remote.settingsRef, { ...state.settings, updatedAt: fs.serverTimestamp() });
      for (const [k, tx] of Object.entries(state.months)) b.set(monthRef(k), { tx });
      for (const k of oldMonths) if (!state.months[k]) b.delete(monthRef(k));
      await b.commit();
    }

    /* ===== 그리기 ===== */
    function render() {
      billCache = null;
      unseenCache = null;
      const active = document.activeElement;
      const focusId = active && active.id;
      const caret = focusId && active.selectionStart;

      $("title").textContent = state.settings.title;
      document.title = state.settings.title;
      const yearMode = tab === "stats" && statsMode === "year";
      $("monthLabel").textContent = yearMode ? `${cur.slice(0, 4)}년` : monthName(cur);
      $("monthNav").hidden = tab === "settings";
      $("fab").hidden = tab === "settings";
      for (const b of document.querySelectorAll(".tabs button")) b.classList.toggle("on", b.dataset.tab === tab);
      for (const t of ["home", "list", "cards", "stats", "settings"]) {
        $(`view-${t}`).hidden = t !== tab;
        if (t !== tab) $(`view-${t}`).innerHTML = "";
      }

      if (tab === "home") renderHome();
      if (tab === "list") renderList();
      if (tab === "cards") renderCards();
      if (tab === "stats") renderStats();
      if (tab === "settings") renderSettings();

      if (focusId && $(focusId) && $(focusId) !== active) {
        $(focusId).focus();
        try { $(focusId).setSelectionRange(caret, caret); } catch (e) { /* 날짜 칸 등 */ }
      }
    }

    function txRow(t, withDate) {
      const c = catOf(t.cat);
      const w = memberOf(t.who);
      const p = t.type !== "in" ? payOf(t.pay) : null;
      const used = t.useDate || t.date;
      const isNew = unseenIds().has(t.id);
      const inst = t.inst > 1 ? (t.instNo ? ` 할부 ${t.instNo}/${t.inst}` : ` ${t.inst}개월 할부`) : "";
      const sub = [
        t.memo ? c.name : "",
        `${w.emoji} ${w.name}`,
        p ? `${p.emoji} ${p.name}${inst}` : "",
        withDate ? `${dayLabel(used)}${t.billed ? " 사용" : ""}` : "",
        t.fixed ? "📌 고정" : "",
        t.refund ? "↩️ 환불·취소" : ""
      ].filter(Boolean).join(" · ");
      return `<button class="tx" data-tx="${esc(t.id)}" data-m="${mkey(used)}">
        <span class="emo">${esc(c.emoji)}</span>
        <span class="tx-main"><span class="tx-title">${esc(t.memo || c.name)}</span><span class="tx-sub">${esc(sub)}</span></span>
        <b class="${t.type === "in" || t.refund ? "inc" : ""}">${isNew ? '<i class="new-dot" title="새 기록"></i>' : ""}${t.type === "in" || t.refund ? "+" : "-"}${won(t.amount)}</b>
      </button>`;
    }

    function renderHome() {
      const s = state.settings;
      const list = spendOf(cur);
      const byBill = s.basis === "bill" && creditCards().length;
      const { out, inc } = sums(list);
      const isNow = cur === mkey(today());
      let html = "";

      if (!me()) {
        html += `<div class="banner"><p>👋 이 휴대폰은 누가 쓰나요? 고르면 기록할 때 자동으로 선택돼요.</p>
          <div class="chips">${s.members.map(m => `<button class="chip" data-me="${esc(m.id)}">${esc(m.emoji)} ${esc(m.name)}</button>`).join("")}</div></div>`;
      }

      const fresh = unseenList();
      if (fresh.length) {
        const by = {};
        for (const t of fresh) {
          const w = t.upd ? t.updBy : t.by;
          const e = (by[w] ||= { add: 0, upd: 0 });
          t.upd ? e.upd++ : e.add++;
        }
        const text = Object.entries(by).map(([w, e]) => `${memberOf(w).emoji} ${memberOf(w).name}: ${[e.add ? `새 기록 ${e.add}건` : "", e.upd ? `고친 기록 ${e.upd}건` : ""].filter(Boolean).join(", ")}`).join(" / ");
        html += `<div class="card"><h3>🔔 새 기록 <button class="link" id="seenOk">확인했어요</button></h3>
          <p class="note" style="margin:0 0 4px">${esc(text)}</p>
          ${fresh.slice(0, 5).map(t => txRow(t, true)).join("")}
          ${fresh.length > 5 ? `<p class="note" style="margin:6px 0 0">외 ${fresh.length - 5}건은 내역에 <i class="new-dot"></i>로 표시돼요</p>` : ""}
        </div>`;
      }

      if (isNow) {
        const list = alerts();
        if (list.length) html += `<div class="card alerts">${list.map(a => `<div class="alert-row">
          <span class="alert-icon">${a.icon}</span>
          <button class="alert-text" ${a.go ? `data-goto="${a.go}"` : a.gocat ? `data-gocat="${esc(a.gocat)}"` : ""}>${esc(a.text)}</button>
          <button class="alert-x" data-dismiss="${esc(a.key)}" aria-label="닫기">✕</button></div>`).join("")}</div>`;
      }

      if (isNow && s.fixed.length && !s.fixedDone[fkey(cur)]) {
        const total = s.fixed.reduce((a, f) => a + (f.type === "in" ? 0 : f.amount), 0);
        html += `<div class="banner"><p>📌 고정지출·수입 <b>${s.fixed.length}건</b>${total ? ` (지출 ${won(total)})` : ""}을 이번 달 내역에 넣을까요?</p>
          <button class="btn small primary" id="applyFixed">넣기</button><button class="btn small" id="skipFixed">이번 달은 안 함</button></div>`;
      }

      let budget = "";
      if (s.monthBudget > 0) {
        const left = s.monthBudget - out;
        const pct = Math.round((out / s.monthBudget) * 100);
        const daysLeft = daysIn(cur) - Number(today().slice(8)) + 1;
        budget = `<div class="budget">
          <div class="budget-top"><span>예산 ${won(s.monthBudget)} 중 ${pct}% 사용</span><b class="${left < 0 ? "neg" : ""}">${left >= 0 ? `${won(left)} 남음` : `${won(-left)} 초과`}</b></div>
          <div class="bar"><i class="${left < 0 ? "over" : ""}" style="width:${Math.min(100, pct)}%"></i></div>
          ${isNow && left > 0 ? `<div class="budget-tip">남은 ${daysLeft}일 동안 하루 <b>${won(Math.floor(left / daysLeft))}</b>씩 쓸 수 있어요</div>` : ""}
        </div>`;
      } else {
        budget = `<div class="budget"><button class="link" id="setBudget">＋ 한 달 예산 정하기</button></div>`;
      }

      html += `<div class="card">
        <div class="hero-label">${monthName(cur)} 쓴 돈${byBill ? " <small>(카드는 결제일 기준)</small>" : ""}</div>
        <div class="hero-amt">${won(out)}</div>
        <div class="hero-row">
          <div><span>들어온 돈</span><b class="inc">${won(inc)}</b></div>
          <div><span>남은 돈 (수입-지출)</span><b class="${inc - out < 0 ? "neg" : ""}">${won(inc - out)}</b></div>
        </div>
        ${budget}
      </div>`;

      // 이번 달 카드값
      if (creditCards().length) {
        const bills = cardBills(cur);
        const total = bills.reduce((a, e) => a + val(e), 0);
        html += `<div class="card"><h3>💳 ${monthName(cur)} 카드값 <button class="link" data-goto="cards">자세히 ›</button></h3>
          <div class="bill-total"><span class="bill-meta">결제일에 나가는 돈 합계</span><b>${won(total)}</b></div>
          ${creditCards().map(p => {
            const v = bills.filter(e => e.pay === p.id).reduce((a, e) => a + val(e), 0);
            const o = p.owner ? memberOf(p.owner) : null;
            return `<button class="set-row" data-goto="cards"><span style="color:var(--text)">${esc(p.emoji)} ${esc(p.name)}${o ? ` <small style="color:var(--sub)">${esc(o.name)}</small>` : ""}</span><span>${Number(cur.slice(5))}월 ${dayIn(cur, p.payDay)}일 · <b style="color:var(--text)">${won(v)}</b></span></button>`;
          }).join("")}
        </div>`;
      }

      // 분류별 지출
      const byCat = {};
      for (const t of list) if (t.type !== "in") byCat[t.cat] = (byCat[t.cat] || 0) + val(t);
      const budgeted = s.cats.filter(c => c.type === "out" && c.budget > 0 && !byCat[c.id]);
      const rows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
      if (rows.length || budgeted.length) {
        const max = rows.length ? rows[0][1] : 1;
        html += `<div class="card"><h3>어디에 썼나 <small>${rows.length}개 분류</small></h3>
          ${out ? `<div class="stack">${rows.map(([id, v]) => `<i style="width:${(v / out) * 100}%;background:${catColor(id)}"></i>`).join("")}</div>` : ""}
          ${[...rows, ...budgeted.map(c => [c.id, 0])].map(([id, v]) => {
            const c = catOf(id);
            const b = c.budget > 0 ? c.budget : 0;
            const w = b ? Math.min(100, (v / b) * 100) : (v / max) * 100;
            const over = b && v > b;
            const sub = [out ? `${Math.round((v / out) * 100)}%` : "", b ? `예산 ${won(b)} 중 ${Math.round((v / b) * 100)}%${over ? " · 초과!" : ""}` : ""].filter(Boolean).join(" · ");
            return `<button class="cat-row" data-gocat="${esc(id)}">
              <span class="emo">${esc(c.emoji)}</span>
              <span class="cat-main">
                <span class="cat-top"><span>${esc(c.name)}</span><b>${won(v)}</b></span>
                <span class="bar"><i class="${over ? "over" : ""}" style="width:${w}%;background:${over ? "" : catColor(id)}"></i></span>
                <span class="cat-sub">${sub}</span>
              </span>
            </button>`;
          }).join("")}
        </div>`;
      }

      // 누가 썼나
      const byWho = {};
      for (const t of list) if (t.type !== "in") byWho[t.who] = (byWho[t.who] || 0) + val(t);
      const whoRows = Object.entries(byWho).sort((a, b) => b[1] - a[1]);
      if (whoRows.length) {
        html += `<div class="card"><h3>누가 썼나</h3>
          ${whoRows.map(([id, v]) => {
            const m = memberOf(id);
            return `<button class="cat-row" data-gowho="${esc(id)}">
              <span class="emo">${esc(m.emoji)}</span>
              <span class="cat-main">
                <span class="cat-top"><span>${esc(m.name)}</span><b>${won(v)}</b></span>
                <span class="bar"><i style="width:${(v / out) * 100}%"></i></span>
              </span>
            </button>`;
          }).join("")}
        </div>`;
      }

      const mine = txOf(cur);
      const recent = mine.sort(byNewest).slice(0, 5);
      html += `<div class="card"><h3>최근 내역 ${mine.length > 5 ? `<button class="link" data-goto="list">전체 ${mine.length}건 보기 ›</button>` : ""}</h3>
        ${recent.length ? recent.map(t => txRow(t, true)).join("") : `<div class="empty">${monthName(cur)} 기록이 아직 없어요.<br>아래 <b>＋</b> 버튼으로 첫 기록을 남겨 보세요 ✍️</div>`}
      </div>`;

      $("view-home").innerHTML = html;
    }

    function renderList() {
      const s = state.settings;
      const list = txOf(cur);
      const [y, m] = cur.split("-").map(Number);
      const first = new Date(y, m - 1, 1).getDay();
      const n = daysIn(cur);
      const daily = {};
      for (const t of list) {
        const d = Number(t.date.slice(8));
        const e = (daily[d] ||= { out: 0, inc: 0 });
        t.type === "in" ? (e.inc += val(t)) : (e.out += val(t));
      }
      const cardDay = {};
      for (const e of cardBills(cur)) cardDay[Number(e.date.slice(8))] = (cardDay[Number(e.date.slice(8))] || 0) + val(e);
      const todayStr = today();
      if (filter.day > n) filter.day = 0;

      let cal = "일월화수목금토".split("").map(w => `<div class="wd">${w}</div>`).join("");
      for (let i = 0; i < first; i++) cal += "<div></div>";
      for (let d = 1; d <= n; d++) {
        const e = daily[d];
        const cls = ["day", (first + d - 1) % 7 === 0 ? "sun" : "", `${cur}-${pad(d)}` === todayStr ? "today" : "", filter.day === d ? "sel" : ""].join(" ");
        cal += `<button class="${cls}" data-day="${d}"><span class="dn">${d}</span>${e && e.out ? `<span class="do">-${shortWon(e.out)}</span>` : ""}${e && e.inc ? `<span class="di">+${shortWon(e.inc)}</span>` : ""}${cardDay[d] ? `<span class="dc">💳${shortWon(cardDay[d])}</span>` : ""}</button>`;
      }

      const opt = (v, label, sel) => `<option value="${esc(v)}" ${sel === v ? "selected" : ""}>${esc(label)}</option>`;
      $("view-list").innerHTML = `
        <div class="card"><div class="cal">${cal}</div></div>
        <div class="filters">
          <div class="seg" id="fltType">
            ${[["all", "전체"], ["out", "지출"], ["in", "수입"]].map(([v, l]) => `<button data-ftype="${v}" class="${filter.type === v ? "on" : ""}">${l}</button>`).join("")}
          </div>
          <select id="fltWho">${opt("", "모든 사람", filter.who)}${s.members.map(mm => opt(mm.id, `${mm.emoji} ${mm.name}`, filter.who)).join("")}</select>
          ${s.payments.length > 1 ? `<select id="fltPay">${opt("", "모든 결제수단", filter.pay)}${s.payments.map(p => opt(p.id, `${p.emoji} ${p.name}`, filter.pay)).join("")}</select>` : ""}
          ${(() => { const tags = topTags(allTx()); return tags.length ? `<select id="fltTag">${opt("", "모든 태그", filter.tag)}${tags.map(g => opt(g, `#${g}`, filter.tag)).join("")}</select>` : ""; })()}
          <select id="fltCat">${opt("", "모든 분류", filter.cat)}${s.cats.map(c => opt(c.id, `${c.emoji} ${c.name}`, filter.cat)).join("")}</select>
          <input id="fltQ" type="search" placeholder="🔍 메모 검색" value="${esc(filter.q)}" />
        </div>
        <div id="listBody"></div>`;
      renderListBody();
    }

    function renderListBody() {
      const q = filter.q.trim().toLowerCase();
      // 태그는 여행처럼 여러 달에 걸치니 전체 기간에서 찾습니다
      const list = (filter.tag ? allTx() : txOf(cur)).filter(t =>
        (filter.type === "all" || t.type === filter.type) &&
        (!filter.who || t.who === filter.who) &&
        (!filter.cat || t.cat === filter.cat) &&
        (!filter.pay || t.pay === filter.pay) &&
        (!filter.tag || tagsOf(t).includes(filter.tag)) &&
        (!filter.day || filter.tag || Number(t.date.slice(8)) === filter.day) &&
        (!q || (t.memo || "").toLowerCase().includes(q) || catOf(t.cat).name.toLowerCase().includes(q))
      ).sort(byNewest);
      const { out, inc } = sums(list);
      const filtered = filter.type !== "all" || filter.who || filter.cat || filter.pay || filter.tag || filter.day || q;

      let html = `<div class="list-sum">${filter.tag ? `#${esc(filter.tag)} 전체 기간 · ` : ""}${filter.day ? `${Number(cur.slice(5))}월 ${filter.day}일 · ` : ""}${list.length}건 · 지출 ${won(out)} · 수입 ${won(inc)}
        ${filtered ? ` <button class="link" id="clearFilter">필터 지우기</button>` : ""}</div>`;
      if (filter.day) {
        const due = {};
        for (const e of cardBills(cur)) if (Number(e.date.slice(8)) === filter.day) due[e.pay] = (due[e.pay] || 0) + val(e);
        for (const [id, v] of Object.entries(due)) {
          const p = payOf(id);
          html += `<button class="cardpay" data-goto="cards"><span>${esc(p.emoji)} ${esc(p.name)} 카드값 나가는 날</span><span>-${won(v)} ›</span></button>`;
        }
      }
      if (!list.length) {
        html += `<div class="card"><div class="empty">${filtered ? "조건에 맞는 기록이 없어요." : "이 달 기록이 아직 없어요."}</div></div>`;
      } else {
        html += `<div class="card">`;
        let lastDate = "";
        for (const t of list) {
          if (t.date !== lastDate) {
            lastDate = t.date;
            const d = sums(list.filter(x => x.date === t.date));
            html += `<div class="day-head"><span>${dayLabel(t.date)}</span><span>${d.out ? `-${won(d.out)}` : ""}${d.out && d.inc ? " · " : ""}${d.inc ? `+${won(d.inc)}` : ""}</span></div>`;
          }
          html += txRow(t, false);
        }
        html += `</div>`;
      }
      $("listBody").innerHTML = html;
    }

    /* ===== 통계 (월별 / 연도별) =====
       그래프는 Chart.js(무료, cdnjs)로 그리고, 못 불러오면 간단한 막대로 대신 보여 줍니다. */
    const CHART_URL = "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js";
    let chartLib = null;
    let charts = [];
    let chartToken = 0;

    function loadChart() {
      if (window.Chart) return Promise.resolve(window.Chart);
      chartLib ||= new Promise((resolve, reject) => {
        const el = document.createElement("script");
        el.src = CHART_URL;
        el.onload = () => resolve(window.Chart);
        el.onerror = () => { chartLib = null; reject(new Error("chart")); };
        document.head.append(el);
      });
      return chartLib;
    }

    const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

    function drawCharts(specs) {
      const token = ++chartToken;
      for (const c of charts) c.destroy();
      charts = [];
      if (!specs.length) return;
      loadChart().then(Chart => {
        if (token !== chartToken) return;
        Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
        Chart.defaults.color = cssVar("--sub");
        for (const { id, config } of specs) {
          const el = $(id);
          if (el) charts.push(new Chart(el, config));
        }
        for (const el of document.querySelectorAll("#view-stats .needs-chart")) el.hidden = false;
        for (const el of document.querySelectorAll("#view-stats .chart-fallback")) el.hidden = true;
      }).catch(() => { /* 오프라인이면 막대 그림만 보여 줌 */ });
    }

    function axes(two) {
      const tick = { callback: v => shortWon(v) };
      const scales = {
        x: { grid: { display: false } },
        y: { beginAtZero: true, ticks: tick, grid: { color: cssVar("--line") } }
      };
      if (two) scales.y2 = { beginAtZero: true, position: "right", ticks: tick, grid: { display: false } };
      return scales;
    }

    const wonTooltip = { callbacks: { label: c => `${c.dataset.label || c.label}: ${won(c.parsed.y ?? c.parsed)}` } };

    function colBars(keys, label) {
      const data = keys.map(k => ({ k, ...sums(spendOf(k)) }));
      const max = Math.max(1, ...data.map(d => Math.max(d.out, d.inc)));
      return `<div class="chart">${data.map(d => `<button class="col ${d.k === cur ? "cur" : ""}" data-month="${d.k}">
          <span class="bars"><i class="b-in" style="height:${(d.inc / max) * 100}%"></i><i class="b-out" style="height:${(d.out / max) * 100}%"></i></span>
          <span class="cv">${d.out ? shortWon(d.out) : ""}</span>
          <span class="cl">${label(d.k)}</span>
        </button>`).join("")}</div>
        <div class="legend"><span style="--c:var(--in)">수입</span><span style="--c:var(--out)">지출</span></div>`;
    }

    function catTotals(list) {
      const m = {};
      for (const t of list) if (t.type !== "in") m[t.cat] = (m[t.cat] || 0) + val(t);
      return Object.entries(m).sort((a, b) => b[1] - a[1]);
    }

    function donutCard(title, rows, total, id, extra) {
      if (!rows.length) return "";
      return `<div class="card"><h3>${title} <small>${won(total)}</small></h3>
        <div class="donut-wrap">
          <div class="donut needs-chart" hidden><canvas id="${id}"></canvas></div>
          <div class="donut-list">${rows.map(([cid, v]) => {
            const c = catOf(cid);
            return `<button class="dl-row" data-gocat="${esc(cid)}"><i style="background:${catColor(cid)}"></i><span>${esc(c.emoji)} ${esc(c.name)}</span><b>${won(v)}</b><small>${Math.round((v / total) * 100)}%${extra ? extra(v) : ""}</small></button>`;
          }).join("")}</div>
        </div></div>`;
    }

    function donutSpec(id, rows) {
      return {
        id,
        config: {
          type: "doughnut",
          data: {
            labels: rows.map(([cid]) => catOf(cid).name),
            datasets: [{ data: rows.map(r => r[1]), backgroundColor: rows.map(([cid]) => catColor(cid)), borderWidth: 2, borderColor: cssVar("--card") }]
          },
          options: { maintainAspectRatio: false, cutout: "62%", plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.label}: ${won(c.parsed)}` } } } }
        }
      };
    }

    function whoCard(list, out) {
      const byWho = {};
      for (const t of list) if (t.type !== "in") byWho[t.who] = (byWho[t.who] || 0) + val(t);
      const rows = Object.entries(byWho).sort((a, b) => b[1] - a[1]);
      if (!rows.length) return "";
      return `<div class="card"><h3>누가 썼나</h3>${rows.map(([id, v]) => {
        const m = memberOf(id);
        return `<div class="cat-row"><span class="emo">${esc(m.emoji)}</span><span class="cat-main">
          <span class="cat-top"><span>${esc(m.name)}</span><b>${won(v)} <small style="color:var(--sub);font-weight:500">${Math.round((v / out) * 100)}%</small></b></span>
          <span class="bar"><i style="width:${(v / out) * 100}%"></i></span></span></div>`;
      }).join("")}</div>`;
    }

    function tagCard(list, title) {
      const n = {};
      for (const t of list) if (t.type !== "in") for (const g of tagsOf(t)) n[g] = (n[g] || 0) + val(t);
      const rows = Object.entries(n).sort((a, b) => b[1] - a[1]);
      if (!rows.length) return "";
      return `<div class="card"><h3>${title} <small>누르면 내역 보기</small></h3>${rows.map(([g, v]) =>
        `<button class="set-row" data-gotag="${esc(g)}"><b>#${esc(g)}</b><span style="color:var(--text)">${won(v)}</span></button>`).join("")}</div>`;
    }

    function renderStats() {
      const toggle = `<div class="seg big stats-seg">${[["month", "📅 월별"], ["year", "🗓️ 연도별"]].map(([v, l]) => `<button data-smode="${v}" class="${statsMode === v ? "on" : ""}">${l}</button>`).join("")}</div>`;
      const out = statsMode === "year" ? yearStats() : monthStats();
      const note = state.settings.basis === "bill" && creditCards().length
        ? `<p class="note">💳 신용카드는 <b>결제일 기준</b>으로 셌어요. <button class="link" data-tab="settings">기준 바꾸기</button></p>` : "";
      $("view-stats").innerHTML = toggle + note + out.html;
      drawCharts(out.specs);
    }

    function monthStats() {
      const s = state.settings;
      const list = spendOf(cur);
      const { out, inc } = sums(list);
      const n = daysIn(cur);
      const isNow = cur === mkey(today());
      const lastDay = isNow ? Number(today().slice(8)) : cur > mkey(today()) ? 0 : n;
      const daily = Array(n).fill(0);
      for (const t of list) if (t.type !== "in") daily[Number(t.date.slice(8)) - 1] += val(t);
      let acc = 0;
      const cumulative = daily.map((v, i) => (i < lastDay ? (acc += v) : null));
      const spentDays = daily.filter(Boolean).length;
      const specs = [];

      let html = `<div class="card"><h3>${monthName(cur)} 한눈에</h3>
        <div class="grid2">
          <div class="stat"><span>수입</span><b class="inc">${won(inc)}</b></div>
          <div class="stat"><span>지출</span><b>${won(out)}</b></div>
          <div class="stat"><span>남은 돈</span><b class="${inc - out < 0 ? "neg" : ""}">${won(inc - out)}</b></div>
          <div class="stat"><span>하루 평균 지출</span><b>${lastDay ? won(out / lastDay) : "-"}</b></div>
          <div class="stat"><span>돈 쓴 날 / 안 쓴 날</span><b>${spentDays}일 / ${Math.max(0, lastDay - daily.slice(0, lastDay).filter(Boolean).length)}일</b></div>
          <div class="stat"><span>가장 많이 쓴 날</span><b>${out ? `${daily.indexOf(Math.max(...daily)) + 1}일 · ${shortWon(Math.max(...daily))}` : "-"}</b></div>
        </div></div>`;

      if (out) {
        html += `<div class="card needs-chart" hidden><h3>매일 쓴 돈 <small>막대를 누르면 그날 내역</small></h3><div class="chart-box"><canvas id="chDaily"></canvas></div></div>`;
        const datasets = [
          { type: "bar", label: "하루 지출", data: daily, backgroundColor: cssVar("--out"), borderRadius: 3, yAxisID: "y", order: 2 },
          { type: "line", label: "누적 지출", data: cumulative, borderColor: cssVar("--primary"), backgroundColor: cssVar("--primary"), pointRadius: 0, borderWidth: 2.5, tension: 0.25, yAxisID: "y2", order: 1 }
        ];
        if (s.monthBudget) datasets.push({ type: "line", label: "예산", data: Array(n).fill(s.monthBudget), borderColor: cssVar("--sub"), borderDash: [5, 4], pointRadius: 0, borderWidth: 1.5, yAxisID: "y2", order: 0 });
        specs.push({
          id: "chDaily",
          config: {
            type: "bar",
            data: { labels: daily.map((_, i) => `${i + 1}일`), datasets },
            options: {
              maintainAspectRatio: false,
              interaction: { mode: "index", intersect: false },
              plugins: { legend: { labels: { boxWidth: 10 } }, tooltip: wonTooltip },
              scales: axes(true),
              onClick: (e, els) => {
                if (!els.length) return;
                Object.assign(filter, { type: "all", who: "", cat: "", q: "", pay: "", tag: "", day: els[0].index + 1 });
                tab = "list";
                render();
              }
            }
          }
        });
      }

      const rows = catTotals(list);
      html += donutCard("분류별 지출", rows, out, "chCatM");
      if (rows.length) specs.push(donutSpec("chCatM", rows));
      html += whoCard(list, out);
      html += tagCard(list, "태그별 지출");

      html += `<div class="card"><h3>최근 6개월 <small>막대를 누르면 그 달로 이동</small></h3>
        ${colBars(Array.from({ length: 6 }, (_, i) => shiftMonth(cur, i - 5)), k => `${Number(k.slice(5))}월`)}</div>`;

      // 지난달과 비교
      const prev = shiftMonth(cur, -1);
      const a = Object.fromEntries(catTotals(list));
      const b = Object.fromEntries(catTotals(spendOf(prev)));
      const ids = [...new Set([...Object.keys(a), ...Object.keys(b)])].sort((x, y) => (a[y] || 0) - (a[x] || 0));
      const totB = sums(spendOf(prev)).out;
      const diffText = (now, before) => {
        const d = now - before;
        if (!d) return "변화 없음";
        return `<span class="${d > 0 ? "diff-up" : "diff-down"}">${d > 0 ? "▲" : "▼"} ${shortWon(Math.abs(d))}</span>`;
      };
      const cmpRow = (label, now, before) => `<div class="cmp-row"><span>${label}</span>
        <span class="cmp-r"><b>${won(now)}</b><small>지난달 ${shortWon(before)} · ${diffText(now, before)}</small></span></div>`;
      html += `<div class="card"><h3>지난달과 비교 <small>${monthName(prev)} → ${monthName(cur)}</small></h3>
        ${cmpRow("<b>전체 지출</b>", out, totB)}
        ${ids.map(id => {
          const c = catOf(id);
          return cmpRow(`${esc(c.emoji)} ${esc(c.name)}`, a[id] || 0, b[id] || 0);
        }).join("") || `<div class="empty">비교할 지출이 아직 없어요.</div>`}
      </div>`;
      return { html, specs };
    }

    function yearStats() {
      const year = cur.slice(0, 4);
      const keys = Array.from({ length: 12 }, (_, i) => `${year}-${pad(i + 1)}`);
      const data = keys.map(k => ({ k, ...sums(spendOf(k)) }));
      const list = keys.flatMap(spendOf);
      const ys = sums(list);
      const nowKey = mkey(today());
      const span = year < nowKey.slice(0, 4) ? 12 : year > nowKey.slice(0, 4) ? 0 : Number(nowKey.slice(5));
      const used = data.filter(d => d.out || d.inc).length;
      const avgDiv = Math.max(1, span || used);
      const specs = [];

      let html = `<div class="card"><h3>${year}년 요약 <small>${span && span < 12 ? `${span}월까지` : ""}</small></h3>
        <div class="grid2">
          <div class="stat"><span>총수입</span><b class="inc">${won(ys.inc)}</b></div>
          <div class="stat"><span>총지출</span><b>${won(ys.out)}</b></div>
          <div class="stat"><span>모은 돈</span><b class="${ys.inc - ys.out < 0 ? "neg" : ""}">${won(ys.inc - ys.out)}</b></div>
          <div class="stat"><span>저축률</span><b>${ys.inc ? Math.round(((ys.inc - ys.out) / ys.inc) * 100) + "%" : "-"}</b></div>
          <div class="stat"><span>월평균 수입</span><b>${won(ys.inc / avgDiv)}</b></div>
          <div class="stat"><span>월평균 지출</span><b>${won(ys.out / avgDiv)}</b></div>
        </div></div>`;

      html += `<div class="card"><h3>월별 흐름 <small>막대를 누르면 그 달 보기</small></h3>
        <div class="chart-box tall needs-chart" hidden><canvas id="chYear"></canvas></div>
        <div class="chart-fallback">${colBars(keys, k => String(Number(k.slice(5))))}</div></div>`;
      specs.push({
        id: "chYear",
        config: {
          type: "bar",
          data: {
            labels: keys.map(k => `${Number(k.slice(5))}월`),
            datasets: [
              { type: "line", label: "남은 돈", data: data.map(d => (d.out || d.inc ? d.inc - d.out : null)), borderColor: cssVar("--primary"), backgroundColor: cssVar("--primary"), pointRadius: 3, borderWidth: 2, tension: 0.25, spanGaps: true, order: 0 },
              { label: "수입", data: data.map(d => d.inc), backgroundColor: cssVar("--in"), borderRadius: 4, order: 1 },
              { label: "지출", data: data.map(d => d.out), backgroundColor: cssVar("--out"), borderRadius: 4, order: 1 }
            ]
          },
          options: {
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            plugins: { legend: { labels: { boxWidth: 10 } }, tooltip: wonTooltip },
            scales: axes(false),
            onClick: (e, els) => {
              if (!els.length) return;
              cur = keys[els[0].index];
              statsMode = "month";
              render();
            }
          }
        }
      });

      // 월별 표
      html += `<div class="card"><h3>월별 표</h3>
        <div class="mtable">
          <div class="mt-row mt-head"><span>월</span><span>수입</span><span>지출</span><span>남은 돈</span></div>
          ${data.map(d => `<button class="mt-row ${d.k === nowKey ? "cur" : ""}" data-month="${d.k}" data-smonth="1">
            <span>${Number(d.k.slice(5))}월</span><span class="inc">${d.inc ? shortWon(d.inc) : "-"}</span><span>${d.out ? shortWon(d.out) : "-"}</span>
            <span class="${d.inc - d.out < 0 ? "neg" : ""}">${d.inc || d.out ? shortWon(d.inc - d.out) : "-"}</span></button>`).join("")}
          <div class="mt-row mt-total"><span>합계</span><span class="inc">${shortWon(ys.inc)}</span><span>${shortWon(ys.out)}</span><span class="${ys.inc - ys.out < 0 ? "neg" : ""}">${shortWon(ys.inc - ys.out)}</span></div>
        </div></div>`;

      const rows = catTotals(list);
      html += donutCard(`${year}년 분류별 지출`, rows, ys.out, "chCatY", v => ` · 월 ${shortWon(v / avgDiv)}`);
      if (rows.length) specs.push(donutSpec("chCatY", rows));
      html += whoCard(list, ys.out);
      html += tagCard(list, `${year}년 태그별 지출`);

      // 해마다 비교
      const monthKeys = Object.keys(state.settings.basis === "bill" ? billIndex() : state.months);
      const years = [...new Set(monthKeys.map(k => k.slice(0, 4)))].sort();
      if (years.length > 1) {
        html += `<div class="card"><h3>해마다 비교</h3>${years.map(y => {
          const t = sums(monthKeys.filter(k => k.startsWith(y)).flatMap(spendOf));
          return `<button class="set-row" data-year="${y}"><b>${y}년</b><span>수입 ${shortWon(t.inc)} · 지출 ${shortWon(t.out)} · <b class="${t.inc - t.out < 0 ? "neg" : "inc"}">${shortWon(t.inc - t.out)}</b></span></button>`;
        }).join("")}</div>`;
      }
      return { html, specs };
    }

    function renderCards() {
      const cards = creditCards();
      let html = "";
      if (!cards.length) {
        html += `<div class="card"><div class="empty">💳 신용카드를 등록하면<br>카드마다 <b>결제일에 나갈 카드값</b>을 모아서 보여 드려요.<br>할부도 회차별로 나눠서 계산해요.</div>
          <button class="btn primary" style="width:100%" data-addpay="credit">＋ 신용카드 등록</button></div>`;
      } else {
        const bills = cardBills(cur);
        const total = bills.reduce((a, e) => a + val(e), 0);
        const nextK = shiftMonth(cur, 1);
        const nextTotal = cardBills(nextK).reduce((a, e) => a + val(e), 0);
        html += `<div class="card">
          <div class="bill-total"><span class="hero-label">${monthName(cur)} 카드값 합계</span><b>${won(total)}</b></div>
          <div class="bill-meta" style="margin-top:6px">${monthName(nextK)}에 나갈 돈 (지금까지): ${won(nextTotal)}</div>
        </div>`;
        for (const p of cards) {
          const mine = bills.filter(e => e.pay === p.id).sort((a, b) => a.useDate.localeCompare(b.useDate) || (a.at || 0) - (b.at || 0));
          const v = mine.reduce((a, e) => a + val(e), 0);
          const [from, to] = usePeriod(p, cur);
          const o = p.owner ? memberOf(p.owner) : null;
          const byWho = {};
          for (const e of mine) byWho[e.who] = (byWho[e.who] || 0) + val(e);
          const instN = mine.filter(e => e.instNo).length;
          const perf = p.perf ? perfBox(p) : "";
          html += `<div class="card">
            <div class="bill-head">
              <span class="emo">${esc(p.emoji)}</span>
              <span class="cat-main" style="flex:1">
                <b style="font-size:1rem">${esc(p.name)}</b>${o ? ` <small style="color:var(--sub);white-space:nowrap">${esc(o.emoji)} ${esc(o.name)}</small>` : ""}
                <div class="bill-meta">${dayLabel(`${cur}-${pad(dayIn(cur, p.payDay))}`)} 결제 · 이용 ${Number(from.slice(5, 7))}/${Number(from.slice(8))}~${Number(to.slice(5, 7))}/${Number(to.slice(8))}</div>
              </span>
              <b>${won(v)}</b>
              <button class="link" data-editpay="${esc(p.id)}" aria-label="카드 설정">⚙️</button>
            </div>
            ${Object.keys(byWho).length ? `<div class="who-chips">${Object.entries(byWho).sort((a, b) => b[1] - a[1]).map(([id, x]) => `<span>${esc(memberOf(id).emoji)} ${esc(memberOf(id).name)} ${shortWon(x)}</span>`).join("")}${instN ? `<span>할부 ${instN}건</span>` : ""}</div>` : ""}
            ${perf}
            ${mine.length ? `<details class="bill-list"><summary>쓴 내역 ${mine.length}건 보기</summary>${mine.map(e => txRow(e, true)).join("")}</details>` : `<div class="bill-meta" style="margin-top:8px">이번 결제일에 나갈 내역이 없어요.</div>`}
          </div>`;
        }
      }

      // 실적만 보는 체크카드
      for (const p of state.settings.payments.filter(x => x.kind === "check" && x.perf)) {
        html += `<div class="card"><div class="bill-head"><span class="emo">${esc(p.emoji)}</span><span class="cat-main" style="flex:1"><b style="font-size:1rem">${esc(p.name)}</b> <small style="color:var(--sub)">체크카드</small></span></div>
          ${perfBox(p)}</div>`;
      }

      // 결제수단별 (쓴 날 기준)
      const used = {};
      for (const t of txOf(cur)) if (t.type !== "in") used[t.pay || ""] = (used[t.pay || ""] || 0) + val(t);
      const rows = Object.entries(used).sort((a, b) => b[1] - a[1]);
      if (rows.length) {
        const tot = rows.reduce((a, r) => a + r[1], 0);
        html += `<div class="card"><h3>${monthName(cur)}에 쓴 돈 · 결제수단별 <small>쓴 날 기준</small></h3>
          ${rows.map(([id, v]) => {
            const p = payOf(id) || { emoji: "❔", name: "결제수단 안 고름", kind: "" };
            return `<div class="cat-row"><span class="emo">${esc(p.emoji)}</span><span class="cat-main">
              <span class="cat-top"><span>${esc(p.name)} <small style="color:var(--sub)">${PAY_KINDS[p.kind] || ""}</small></span><b>${won(v)}</b></span>
              <span class="bar"><i style="width:${(v / tot) * 100}%;background:var(--cardc)"></i></span></span></div>`;
          }).join("")}
        </div>`;
      }
      html += `<button class="btn" style="width:100%" data-tab="settings">💳 카드·결제수단 관리</button>`;
      $("view-cards").innerHTML = html;
    }

    function renderSettings() {
      const s = state.settings;
      const myId = me();
      const outCats = s.cats.filter(c => c.type === "out");
      const inCats = s.cats.filter(c => c.type === "in");
      const catChip = c => `<button class="chip" data-editcat="${esc(c.id)}">${esc(c.emoji)} ${esc(c.name)}${c.budget ? ` <small>${shortWon(c.budget)}</small>` : ""}</button>`;

      $("view-settings").innerHTML = `
        <div class="card"><h3>👨‍👩‍👧 함께 쓰기</h3><div id="shareBody"></div></div>

        <div class="card"><h3>이 휴대폰 사용자</h3>
          <p class="note">기록할 때 “누가”에 자동으로 선택돼요.</p>
          <div class="chips">${s.members.map(m => `<button class="chip ${m.id === myId ? "on" : ""}" data-me="${esc(m.id)}">${esc(m.emoji)} ${esc(m.name)}</button>`).join("")}</div>
        </div>

        <div class="card"><h3>💳 카드·결제수단 <button class="link" data-addpay="credit">＋ 추가</button></h3>
          ${s.payments.map(p => {
            const o = p.owner ? memberOf(p.owner) : null;
            const info = (p.kind === "credit" ? `매달 ${p.payDay}일 결제 · ${p.cutDay >= 31 ? "말일" : `${p.cutDay}일`} 마감` : PAY_KINDS[p.kind]) + (p.perf ? ` · 실적 ${shortWon(p.perf)}(${(p.perfDay || 1) === 1 ? "1일~말일" : `${p.perfDay}일~`})` : "");
            return `<button class="set-row" data-editpay="${esc(p.id)}"><span style="color:var(--text)">${esc(p.emoji)} ${esc(p.name)}${o ? ` <small style="color:var(--sub)">${esc(o.name)}</small>` : ""}</span><span>${info} ›</span></button>`;
          }).join("")}
          <div class="sub-h">홈·통계에서 신용카드 지출을 언제 쓴 돈으로 볼까요?</div>
          <div class="seg big" id="basisSeg">
            <button data-basis="bill" class="${s.basis === "bill" ? "on" : ""}">카드값 나가는 날</button>
            <button data-basis="use" class="${s.basis === "use" ? "on" : ""}">카드 쓴 날</button>
          </div>
          <p class="note" style="margin:8px 0 0">${s.basis === "bill"
            ? "10월에 카드로 쓴 돈은 11월 결제일에 합산돼요. 통장에서 실제로 나가는 돈 기준이에요. (내역 탭은 언제나 쓴 날 기준)"
            : "카드로 쓴 날 바로 그 달 지출로 셉니다. 카드값은 💳 카드 탭에서 결제일별로 볼 수 있어요."}</p>
        </div>

        <div class="card"><h3>💰 예산</h3>
          <button class="set-row" id="setBudget"><b>한 달 예산</b><span>${s.monthBudget ? won(s.monthBudget) : "정하지 않음"} ›</span></button>
          <p class="note" style="margin:6px 0 0">분류별 예산은 아래 지출 분류를 눌러서 정해요.</p>
        </div>

        <div class="card"><h3>📌 고정지출·수입 <button class="link" id="addFixed">＋ 추가</button></h3>
          <p class="note">월세·관리비·보험·통신비·월급처럼 매달 같은 돈은 등록해 두면, 매달 홈 화면에서 한 번에 넣을 수 있어요.</p>
          ${s.fixed.length ? s.fixed.slice().sort((a, b) => a.day - b.day).map(f => {
            const c = catOf(f.cat);
            return `<button class="set-row" data-editfixed="${esc(f.id)}"><span style="color:var(--text)">${esc(c.emoji)} 매달 ${f.day}일 · ${esc(f.memo || c.name)}</span><b class="${f.type === "in" ? "inc" : ""}">${f.type === "in" ? "+" : "-"}${won(f.amount)}</b></button>`;
          }).join("") : ""}
        </div>

        <div class="card"><h3>⭐ 자주 쓰는 내역</h3>
          <p class="note">기록할 때 ⭐ 버튼으로 저장하면 기록 창 맨 위에서 한 번에 고를 수 있어요. 세 번 이상 적은 메모도 자동으로 나와요.</p>
          ${s.favs.length ? `<div class="chips">${s.favs.map(f => `<button class="chip" data-delfav="${esc(f.id)}">${esc(catOf(f.cat).emoji)} ${esc(f.memo || catOf(f.cat).name)} <small>${shortWon(f.amount)} ✕</small></button>`).join("")}</div>` : ""}
        </div>

        <div class="card"><h3>분류</h3>
          <div class="sub-h">지출</div>
          <div class="chips">${outCats.map(catChip).join("")}<button class="chip add" data-addcat="out">＋ 추가</button></div>
          <div class="sub-h">수입</div>
          <div class="chips">${inCats.map(catChip).join("")}<button class="chip add" data-addcat="in">＋ 추가</button></div>
        </div>

        <div class="card"><h3>구성원</h3>
          <div class="chips">${s.members.map(m => `<button class="chip" data-editmember="${esc(m.id)}">${esc(m.emoji)} ${esc(m.name)}</button>`).join("")}<button class="chip add" id="addMember">＋ 추가</button></div>
        </div>

        <div class="card"><h3>데이터</h3>
          <div class="btn-row">
            <button class="btn" id="csvMonth">📄 ${monthName(cur)} 엑셀(CSV)</button>
            <button class="btn" id="csvAll">📄 전체 엑셀(CSV)</button>
            <button class="btn" id="backup">💾 백업 저장</button>
            <button class="btn" id="restore">📂 백업 불러오기</button>
          </div>
          <p class="note" style="margin:10px 0 0">기록 ${allTx().length}건 · 가계부 이름은 맨 위 제목을 눌러 바꿀 수 있어요.</p>
        </div>`;
      renderShare();
    }

    /* ===== 시트 (아래에서 올라오는 창) ===== */
    function openSheet(html) {
      $("sheet").innerHTML = html;
      $("sheetBg").hidden = false;
    }

    function closeSheet() {
      $("sheetBg").hidden = true;
      $("sheet").innerHTML = "";
    }

    $("sheetBg").addEventListener("click", e => {
      if (e.target === $("sheetBg") || e.target.closest("[data-close]")) closeSheet();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && !$("sheetBg").hidden) closeSheet();
    });

    const head = title => `<div class="sheet-head"><h2>${title}</h2><button class="x" data-close aria-label="닫기">✕</button></div>`;

    // 자주 쓰는 내역: 즐겨찾기 + 최근에 3번 이상 쓴 메모
    function quickPicks(recent) {
      const favs = state.settings.favs;
      const seen = new Set(favs.map(f => f.memo));
      const count = {};
      for (const t of recent.slice(0, 300)) {
        if (t.type !== "out" || t.refund || !t.memo || seen.has(t.memo)) continue;
        (count[t.memo] ||= { n: 0, t }).n++;
      }
      const auto = Object.values(count).filter(c => c.n >= 3).sort((a, b) => b.n - a.n).map(c => c.t);
      return [...favs, ...auto].slice(0, 8);
    }

    function tagsOf(t) {
      return ((t.memo || "").match(/#[^\s#]+/g) || []).map(x => x.slice(1));
    }

    function topTags(list) {
      const n = {};
      for (const t of list) for (const g of tagsOf(t)) n[g] = (n[g] || 0) + 1;
      return Object.entries(n).sort((a, b) => b[1] - a[1]).map(([g]) => g);
    }

    function stamp(ms) {
      const d = new Date(ms);
      return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function whoWrote(t) {
      const parts = [];
      if (t.by && t.at > 1e12) parts.push(`${memberOf(t.by).emoji} ${memberOf(t.by).name} · ${stamp(t.at)} 적음`);
      if (t.upd) parts.push(`${t.updBy ? `${memberOf(t.updBy).emoji} ${memberOf(t.updBy).name} · ` : ""}${stamp(t.upd)} 고침`);
      return parts.join(" · ");
    }

    /* ===== 카드 문자 읽기 =====
       예) [Web발신] 신한카드(1234)승인 홍*동 12,000원(일시불)10/23 14:22 스타벅스 누적345,000원
           KB국민카드1*2*승인 / 홍*동님 / 35,000원 3개월 / 10/23 12:01 / 이마트 / 누적… */
    function parseSms(text) {
      const t = text.replace(/\[Web발신\]/g, " ").replace(/\r/g, "");
      const am = t.match(/(\d{1,3}(?:,\d{3})+|\d+)\s*원/);
      const r = { amount: am ? digits(am[1]) : 0, cancel: /취소/.test(t), inst: 1, date: "", merchant: "", pay: "" };
      const im = t.match(/(\d{1,2})\s*개월/);
      if (im && Number(im[1]) > 1) r.inst = Number(im[1]);
      const dm = t.match(/(?:^|[^\d])(\d{1,2})[/.-](\d{1,2})(?:\s*(\d{1,2}):(\d{2}))?/);
      if (dm && Number(dm[1]) >= 1 && Number(dm[1]) <= 12 && Number(dm[2]) >= 1 && Number(dm[2]) <= 31) {
        const now = today();
        let y = Number(now.slice(0, 4));
        let date = `${y}-${pad(dm[1])}-${pad(dm[2])}`;
        if (date > now) date = `${y - 1}-${pad(dm[1])}-${pad(dm[2])}`;
        r.date = date;
        const rest = t.slice(dm.index + dm[0].length);
        r.merchant = (rest.split("\n").map(x => x.replace(/(누적|잔액|사용가능).*/, "").trim()).find(Boolean) || "").slice(0, 30);
      }
      // 등록한 카드 이름(“카드”를 뺀 부분)이 문자에 있으면 그 카드로
